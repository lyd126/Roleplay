<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Session</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #09090d; color: #e4e4e7; min-height: 100dvh;
      display: flex; justify-content: center;
      padding: 14px 14px calc(38px + env(safe-area-inset-bottom)) 14px;
      overflow-x: hidden;
    }

    .app-shell { width: 100%; max-width: 680px; display: flex; flex-direction: column; gap: 12px; }
    @media (min-width: 840px) {
      body { padding: 28px; }
      .app-shell { max-width: 780px; }
      .story-feed { max-height: 55vh !important; }
    }

    .card { background: #14141b; border: 1px solid #242432; border-radius: 14px; padding: 18px; }
    .hidden { display: none !important; }

    select, input, textarea {
      width: 100%; padding: 10px 12px; border: 1px solid #2c2c3c; border-radius: 9px;
      background: #0d0d12; color: #f4f4f5; font-size: 14.5px; outline: none;
    }
    select:focus, input:focus, textarea:focus { border-color: #db2777; }

    button {
      padding: 10px 14px; border: none; border-radius: 9px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: opacity 0.15s, transform 0.08s;
      white-space: nowrap; flex-shrink: 0;
    }
    button:active { transform: scale(0.97); }
    .btn-accent { background: linear-gradient(135deg, #9333ea, #db2777); color: #fff; }
    .btn-ghost { background: #1c1c26; border: 1px solid #2c2c3c; color: #cbd5e1; }
    .btn-danger { background: rgba(225, 29, 72, 0.15); border: 1px solid #be123c; color: #fda4af; }

    /* 本地文件拖拽上传区 */
    .drop-zone {
      border: 1.5px dashed #482b4e;
      background: #0f0e15;
      border-radius: 12px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: #ec4899;
      background: rgba(219, 39, 119, 0.08);
    }
    .drop-zone-title { font-size: 14.5px; color: #f4f4f5; font-weight: 600; }
    .drop-zone-sub { font-size: 12.5px; color: #a1a1aa; }

    .login-hint { font-size: 12.5px; color: #f472b6; text-align: center; min-height: 18px; }

    /* 顶部栏 */
    .top-bar { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }
    .presence { display: flex; gap: 6px; align-items: center; }
    .pill {
      display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px;
      border-radius: 99px; font-size: 12.5px; background: #1a1a22; color: #71717a;
    }
    .pill.on { background: rgba(219, 39, 119, 0.18); color: #f472b6; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #52525b; }
    .pill.on .dot { background: #ec4899; box-shadow: 0 0 6px #ec4899; }

    /* 仅展示工具区指令的顶部提示条 */
    .remote-banner {
      background: linear-gradient(135deg, rgba(147, 51, 234, 0.25), rgba(219, 39, 119, 0.25));
      border: 1px solid #ec4899; border-radius: 12px; padding: 11px 14px;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }

    /* 主屏幕活跃任务实时倒计时悬浮条 */
    .active-task-banner {
      background: linear-gradient(135deg, #24192e 0%, #1c1826 100%);
      border: 1px solid #db2777; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px;
      display: flex; flex-direction: column; gap: 10px; box-shadow: 0 4px 16px rgba(219, 39, 119, 0.15);
    }
    .task-top-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .task-countdown-num { font-size: 22px; font-weight: 800; color: #f472b6; font-variant-numeric: tabular-nums; }
    .task-settle-row {
      display: flex; gap: 6px; align-items: center; padding-top: 8px; border-top: 1px dashed #3b2847; flex-wrap: wrap;
    }

    /* 背景引入页 */
    .prologue-box {
      background: linear-gradient(180deg, #1b1624 0%, #14141b 100%);
      border: 1px solid #362542; border-radius: 16px; padding: 26px 22px;
      display: flex; flex-direction: column; gap: 16px;
    }
    .prologue-title { font-size: 21px; font-weight: 800; color: #f472b6; letter-spacing: 1px; text-align: center; }
    .prologue-text { font-size: 15.5px; line-height: 1.85; color: #e4e4e7; white-space: pre-line; }
    .role-card {
      background: rgba(255, 255, 255, 0.03); border-left: 3px solid #9333ea;
      padding: 13px 15px; border-radius: 8px; font-size: 14.5px; line-height: 1.75; color: #d8b4fe;
    }

    /* 模糊阶段氛围刻度 */
    .mood-badges { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
    .mood-pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 9px; border-radius: 8px; font-size: 12px;
      background: #1b1824; border: 1px solid #2f2640; color: #e9d5ff;
    }
    .mood-pill.owner-female { border-color: rgba(244, 114, 182, 0.45); }
    .mood-pill.owner-male { border-color: rgba(129, 140, 248, 0.45); }
    .mood-pill .stage-dot { width: 7px; height: 7px; border-radius: 50%; background: #c084fc; }
    .mood-pill.owner-female .stage-dot { background: #f472b6; }
    .mood-pill.owner-male .stage-dot { background: #818cf8; }
    .mood-owner-tag { font-size: 11px; opacity: 0.75; }

    /* 剧情流容器 + 顶部可滚动渐变提示 */
    .story-feed-wrap { position: relative; }
    .story-top-fade {
      position: absolute; top: 0; left: 0; right: 4px; height: 22px;
      background: linear-gradient(180deg, rgba(20, 20, 27, 0.92) 0%, rgba(20, 20, 27, 0) 100%);
      pointer-events: none; z-index: 5; opacity: 0; transition: opacity 0.2s;
    }
    .story-top-fade.visible { opacity: 1; }

    .story-feed {
      display: flex; flex-direction: column; gap: 12px;
      max-height: 46dvh; overflow-y: auto; padding-right: 4px;
      -webkit-overflow-scrolling: touch;
    }

    .msg-narrator {
      background: #1a1a22;
      border-left: 3.5px solid #64748b;
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 15.5px;
      line-height: 1.8;
      color: #f4f4f5;
    }

    .msg-player {
      background: #181922;
      border: 1px solid #282a3a;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 15px;
      line-height: 1.65;
      color: #e4e4e7;
    }
    .msg-player.female-msg { border-left: 3.5px solid #f472b6; }
    .msg-player.male-msg { border-left: 3.5px solid #818cf8; }
    .msg-player .tag-f { color: #f472b6; font-weight: 700; margin-right: 7px; }
    .msg-player .tag-m { color: #818cf8; font-weight: 700; margin-right: 7px; }

    .msg-sys {
      text-align: center;
      font-size: 12.5px;
      color: #c084fc;
      background: rgba(168, 85, 247, 0.08);
      padding: 6px 12px;
      border-radius: 8px;
    }

    /* 快捷回复胶囊 */
    .quick-replies { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .quick-chip {
      background: #1b1a24; border: 1px solid #322e42; color: #e4e4e7;
      padding: 7px 13px; border-radius: 12px; font-size: 13.5px; font-weight: 500;
      cursor: pointer; transition: border-color 0.15s, background 0.15s; line-height: 1.45;
      text-align: left; user-select: none; -webkit-user-select: none;
    }
    .quick-chip.female-chip { border-left: 3px solid #f472b6; }
    .quick-chip.female-chip:hover { border-color: #f472b6; background: #291d29; }
    .quick-chip.male-chip { border-left: 3px solid #818cf8; }
    .quick-chip.male-chip:hover { border-color: #818cf8; background: #1e2136; }
    .quick-chip.replied-chip { border-left: 3px solid #a855f7; color: #d8b4fe; }
    .quick-chip.replied-chip:hover { border-color: #a855f7; background: #231b30; }

    /* 一键步进数值微调栏 */
    .silent-var-bar { display: flex; gap: 6px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
    .silent-var-bar select { flex: 1.2; min-width: 110px; padding: 8px 10px; font-size: 13px; color: #e4e4e7; }
    .step-btn-group { display: flex; gap: 5px; flex: 1.8; }
    .btn-step {
      flex: 1; padding: 8px 8px; font-size: 12.5px; font-weight: 600;
      background: #1c1c28; border: 1px solid #323246; color: #f4f4f5; border-radius: 8px;
    }
    .btn-step.warm { border-color: rgba(219, 39, 119, 0.5); color: #f9a8d4; }
    .btn-step.hot { background: rgba(219, 39, 119, 0.18); border-color: #db2777; color: #fbcfe8; }
    .btn-step.cool { border-color: rgba(129, 140, 248, 0.45); color: #c7d2fe; }

    /* 固定侧边栏触发器 */
    .drawer-tab {
      position: fixed; right: 0; top: 180px;
      background: #222230; border: 1px solid #3b3b50; border-right: none;
      color: #f472b6; padding: 12px 7px; border-radius: 10px 0 0 10px;
      writing-mode: vertical-rl; font-size: 12px; letter-spacing: 2px; z-index: 40; cursor: pointer;
    }
    .side-drawer {
      position: fixed; right: 0; top: 0; bottom: 0; width: 295px;
      background: #13131a; border-left: 1px solid #2c2c3c; padding: 18px 15px calc(24px + env(safe-area-inset-bottom)) 15px;
      z-index: 60; display: flex; flex-direction: column; gap: 12px; overflow-y: auto;
      transform: translateX(100%); transition: transform 0.22s ease;
    }
    .side-drawer.open { transform: translateX(0); }
    .tool-box { background: #1a1a24; padding: 12px; border-radius: 10px; display: flex; flex-direction: column; gap: 8px; }
    .combo-field { display: flex; flex-direction: column; gap: 4px; }
    .combo-chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .mini-chip {
      font-size: 11px; padding: 2px 7px; border-radius: 6px;
      background: #252534; color: #cbd5e1; cursor: pointer; border: 1px solid #343448;
    }
    .mini-chip:hover { border-color: #db2777; color: #f472b6; }
    .beat-dot { width: 12px; height: 12px; border-radius: 50%; background: #52525b; display: inline-block; transition: transform 0.08s; }
    .beat-dot.pulse { background: #ec4899; transform: scale(1.4); box-shadow: 0 0 10px #ec4899; }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.84);
      display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100;
    }
  </style>
</head>
<body>

  <!-- 登录页 -->
  <div id="login-view" class="app-shell" style="max-width: 360px; justify-content: center;">
    <div class="card" style="display: flex; flex-direction: column; gap: 12px;">
      <select id="player-select">
        <option value="yc@play.game" selected>YC</option>
        <option value="ly@play.game">LY</option>
      </select>
      <div id="login-presence-hint" class="login-hint hidden"></div>
      <input type="password" id="password-input" placeholder="Password" onkeypress="if(event.key==='Enter') document.getElementById('login-btn').click()" />
      <button id="login-btn" class="btn-accent">Enter</button>
      <p id="login-error" style="color:#fb7185; font-size:13px; text-align:center;"></p>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="app-view" class="app-shell hidden">
    <div class="top-bar">
      <div class="presence">
        <div id="pill-yc" class="pill"><span class="dot"></span>YC</div>
        <div id="pill-ly" class="pill"><span class="dot"></span>LY</div>
      </div>
      <div style="display: flex; gap: 5px; flex-wrap: wrap;">
        <button id="btn-toggle-picker" class="btn-ghost hidden" onclick="toggleScriptPicker()">换本</button>
        <button class="btn-ghost" onclick="togglePanel('upload-panel')">+ 剧本</button>
        <button class="btn-ghost" onclick="quickSaveProgress()">存档</button>
        <button class="btn-ghost" onclick="toggleLoadPanel()">读档</button>
        <button class="btn-danger" onclick="document.getElementById('exit-modal').classList.remove('hidden')">退出</button>
      </div>
    </div>

    <!-- 仅展示工具区指令的顶部提示条 -->
    <div id="remote-banner" class="remote-banner hidden">
      <div id="remote-banner-text" style="font-size: 14.5px; color: #fff; line-height: 1.5;"></div>
      <button class="btn-accent" style="padding: 6px 12px; font-size: 12.5px;" onclick="ackRemoteAlert()">收到</button>
    </div>

    <!-- 选本栏 -->
    <div id="script-picker-card" class="card" style="display: flex; gap: 6px;">
      <select id="script-selector" style="flex: 1; min-width: 0;"></select>
      <button class="btn-accent" onclick="startSelectedScript()">开始</button>
      <button class="btn-ghost" onclick="startRandomScript()">🎲</button>
      <button class="btn-danger" onclick="deleteSelectedScript()">删除</button>
    </div>

    <!-- 本地拖拽 / 选择文件上传剧本面板 -->
    <div id="upload-panel" class="card hidden" style="display: flex; flex-direction: column; gap: 10px;">
      <input type="text" id="new-script-title" placeholder="剧本名称（选文件后自动填入，可修改）" />

      <input type="file" id="script-file-input" accept=".json,application/json" class="hidden" onchange="handleScriptFileSelect(this.files[0])" />
      <div id="script-drop-zone" class="drop-zone" onclick="document.getElementById('script-file-input').click()">
        <div class="drop-zone-title" id="drop-zone-title">📂 点击选择本地 .json 剧本文件，或直接拖拽至此</div>
        <div class="drop-zone-sub" id="drop-zone-sub">自动读取剧本中的数值与节点结构</div>
      </div>

      <button id="btn-save-uploaded-script" class="btn-accent" onclick="saveNewScript()" disabled style="opacity:0.45;">保存至云端</button>
    </div>

    <!-- 读档列表 -->
    <div id="load-panel" class="card hidden" style="display: flex; flex-direction: column; gap: 8px;">
      <div id="archives-list" style="font-size: 13.5px; color: #a1a1aa;"></div>
    </div>

    <!-- 阶段 0：背景引入页 -->
    <div id="prologue-view" class="prologue-box hidden">
      <div class="prologue-title" id="prologue-title"></div>
      <div class="prologue-text" id="prologue-bg"></div>
      <div class="role-card" id="prologue-role"></div>
      <button class="btn-accent" style="padding: 13px; font-size: 15.5px; margin-top: 6px;" onclick="enterFirstScene()">进入角色 · 开启今夜</button>
    </div>

    <!-- 阶段 1：正戏舞台 -->
    <div id="stage-view" class="card hidden" style="display: flex; flex-direction: column;">
      <div id="active-script-title" style="font-size: 15px; font-weight: 700; color: #f472b6; margin-bottom: 8px;"></div>

      <div id="mood-badges" class="mood-badges hidden"></div>

      <!-- 主屏幕常驻：带时间的任务实时倒计时 & 结束一键步进结算栏 -->
      <div id="active-task-banner" class="active-task-banner hidden">
        <div class="task-top-row">
          <div style="flex: 1; min-width: 0;">
            <div style="font-size: 11px; color: #f9a8d4; margin-bottom: 2px;">⏱ 正在执行</div>
            <div id="active-task-label" style="font-size: 14px; color: #fff; line-height: 1.45;"></div>
          </div>
          <div style="text-align: right;">
            <div id="active-task-countdown" class="task-countdown-num">00:00</div>
            <button class="btn-ghost" style="padding: 4px 10px; font-size: 12px; margin-top: 4px;" onclick="openTaskSettle()">结束任务</button>
          </div>
        </div>

        <div id="task-settle-row" class="task-settle-row hidden">
          <select id="task-var-key" style="flex: 1.1; min-width: 95px; padding: 7px 8px; font-size: 12.5px;"></select>
          <button class="btn-step warm" style="padding: 7px 9px; font-size: 12px;" onclick="submitTaskCompletion(10)">升温 +10</button>
          <button class="btn-step hot" style="padding: 7px 9px; font-size: 12px;" onclick="submitTaskCompletion(25)">大幅 +25</button>
          <button class="btn-ghost" style="padding: 7px 10px; font-size: 12px;" onclick="submitTaskCompletion(0)">完成不调</button>
        </div>
      </div>

      <!-- 剧情记录流 -->
      <div class="story-feed-wrap">
        <div id="story-top-fade" class="story-top-fade"></div>
        <div class="story-feed" id="story-feed" onscroll="updateStoryScrollFade()"></div>
      </div>

      <!-- 统一回复与操作区（点击快捷回复填入聊天框但不自动弹出软键盘，只有手动点击聊天框才弹出） -->
      <div style="margin-top: 14px; padding-top: 12px; border-top: 1px solid #242432;">
        <div style="display: flex; gap: 8px; align-items: center;">
          <input type="text" id="custom-msg-input" style="flex: 1; min-width: 0;" placeholder="输入回复、动作，或点下方剧本选项..." oninput="onCustomInputTyped()" onkeypress="if(event.key==='Enter') sendCustomMessage()" />
          <button class="btn-accent" style="padding: 11px 18px;" onclick="sendCustomMessage()">发送</button>
        </div>

        <div id="quick-replies-bar" class="quick-replies"></div>

        <div id="silent-var-bar" class="silent-var-bar hidden">
          <select id="silent-var-key"></select>
          <div class="step-btn-group">
            <button class="btn-step warm" onclick="stepAdjustVar(10)">升温 +10</button>
            <button class="btn-step hot" onclick="stepAdjustVar(25)">大幅 +25</button>
            <button class="btn-step cool" onclick="stepAdjustVar(-15)">降温 -15</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 固定位置侧边栏触发器 -->
  <button id="drawer-tab" class="drawer-tab hidden" onclick="document.getElementById('side-drawer').classList.add('open')">工具</button>
  <div id="side-drawer" class="side-drawer">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span style="font-weight:700; color:#f472b6; font-size:14px;">辅助</span>
      <button class="btn-ghost" style="padding:5px 10px; font-size:12px;" onclick="document.getElementById('side-drawer').classList.remove('open')">收起</button>
    </div>

    <div class="tool-box">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:12px; color:#f472b6; font-weight:700;">小惩罚 / 限时挑逗指令</span>
        <button class="btn-ghost" style="padding:3px 8px; font-size:11.5px;" onclick="randomizeThreeFields()">🎲 随机填充</button>
      </div>

      <select id="punish-direction" style="padding:7px 9px; font-size:12.5px; color:#f472b6;">
        <option value="to_partner">主动：我对对方执行</option>
        <option value="by_partner">命令：让对方对我执行</option>
      </select>

      <div class="combo-field">
        <input type="text" id="punish-part" placeholder="部位（点下方快捷词或手填）" style="padding:7px 9px; font-size:12.5px;" />
        <div class="combo-chips">
          <span class="mini-chip" onclick="setField('punish-part','耳垂与颈侧')">耳垂颈侧</span>
          <span class="mini-chip" onclick="setField('punish-part','锁骨窝')">锁骨</span>
          <span class="mini-chip" onclick="setField('punish-part','掌心与指尖')">掌心指尖</span>
          <span class="mini-chip" onclick="setField('punish-part','腰侧')">腰侧</span>
          <span class="mini-chip" onclick="setField('punish-part','后颈')">后颈</span>
        </div>
      </div>

      <div class="combo-field">
        <input type="text" id="punish-action" placeholder="动作（点下方快捷词或手填）" style="padding:7px 9px; font-size:12.5px;" />
        <div class="combo-chips">
          <span class="mini-chip" onclick="setField('punish-action','轻吻并低语挑逗')">轻吻挑逗</span>
          <span class="mini-chip" onclick="setField('punish-action','用指腹打圈挑逗')">指腹挑逗</span>
          <span class="mini-chip" onclick="setField('punish-action','用指尖轻划挑逗')">指尖轻划</span>
          <span class="mini-chip" onclick="setField('punish-action','贴近耳畔呼气低语')">耳畔呼气</span>
          <span class="mini-chip" onclick="setField('punish-action','轻抚并专注对视')">轻抚对视</span>
        </div>
      </div>

      <div class="combo-field">
        <input type="text" id="punish-time" placeholder="时间（如 60秒 / 2分钟）" style="padding:7px 9px; font-size:12.5px;" />
        <div class="combo-chips">
          <span class="mini-chip" onclick="setField('punish-time','30秒')">30秒</span>
          <span class="mini-chip" onclick="setField('punish-time','60秒')">60秒</span>
          <span class="mini-chip" onclick="setField('punish-time','90秒')">90秒</span>
          <span class="mini-chip" onclick="setField('punish-time','2分钟')">2分钟</span>
          <span class="mini-chip" onclick="setField('punish-time','3分钟')">3分钟</span>
        </div>
      </div>

    async function loadScripts() {
      const { data } = await db.from('scripts').select('*').order('created_at', { ascending: false });
      allScripts = data || [];

    function normalizeVars(rawVars) {
      const res = {};
      if (!rawVars || typeof rawVars !== 'object') return res;
      Object.entries(rawVars).forEach(([k, v]) => {
        if (typeof v === 'object' && v !== null) {
          res[k] = {
            val: Number(v.val ?? 0),
            max: Number(v.max ?? 100),
            owner: v.owner || 'both',
            visible: v.visible !== undefined ? Boolean(v.visible) : true,
            trend: v.trend === 'down' ? 'down' : 'up'
          };
        } else {
          res[k] = { val: Number(v ?? 0), max: 100, owner: 'both', visible: true, trend: 'up' };
        }
      });
      return res;
    }

    function getFuzzyStageLabel(item) {
      const ratio = Math.max(0, Math.min(1, (Number(item.val) || 0) / (Number(item.max) || 100)));
      const intensity = item.trend === 'down' ? (1 - ratio) : ratio;

      if (intensity < 0.25) return '初起 · 微澜';
      if (intensity < 0.50) return '渐浓 · 升温';
      if (intensity < 0.75) return '深陷 · 灼热';
      return '极致 · 临界';
    }

    function applyStepDelta(varsObj, key, delta) {
      if (!key || !delta) return varsObj;
      if (!varsObj[key]) varsObj[key] = { val: 0, max: 100, owner: 'both', visible: true, trend: 'up' };
      const item = varsObj[key];
      const effectiveDelta = item.trend === 'down' ? -delta : delta;
      item.val = Math.max(0, Math.min(item.max, item.val + effectiveDelta));
      return varsObj;
    }

    function nodeToLogEntries(node) {
      if (!node || !node.text) return [];
      if (Array.isArray(node.text)) {
        return node.text.map(paragraph => ({ type: 'narrator', text: paragraph }));
      }
      return [{ type: 'narrator', text: node.text }];
    }

    function evaluateConditions(condList, vars) {
      if (!condList || !condList.length) return true;
      return condList.every(cond => {
        const cur = Number((vars[cond.var] || {}).val ?? 0);
        const tgt = Number(cond.val);
        if (cond.op === '>=') return cur >= tgt;
        if (cond.op === '<=') return cur <= tgt;
        if (cond.op === '>') return cur > tgt;
        if (cond.op === '<') return cur < tgt;
        if (cond.op === '==') return cur == tgt;
        return false;
      });
    }

    function checkNodeTriggers(activeScript, currentNodeId, varsObj, logsArr) {
      const currentNode = (activeScript && activeScript.nodes) ? activeScript.nodes[currentNodeId] : null;
      let nextNodeId = currentNodeId;
      if (currentNode && Array.isArray(currentNode.triggers)) {
        for (const trig of currentNode.triggers) {
          const condList = Array.isArray(trig.conditions) ? trig.conditions : (trig.condition ? [trig.condition] : []);
          if (evaluateConditions(condList, varsObj) && trig.next && activeScript.nodes[trig.next]) {
            nextNodeId = trig.next;
            const targetNode = activeScript.nodes[trig.next];
            if (Array.isArray(targetNode.unlock_vars)) {
              targetNode.unlock_vars.forEach(k => { if (varsObj[k]) varsObj[k].visible = true; });
            }
            if (trig.transition_text) {
              logsArr.push({ type: 'sys', text: trig.transition_text });
            }
            logsArr.push(...nodeToLogEntries(targetNode));
            break;
          }
        }
      }
      return nextNodeId;
    }

      const alertObj = gameState.remote_alert || {};

      if (!task || !task.label) {

        lastRenderedTaskEndAt = 0;
        return;
      }

      banner.classList.remove('hidden');
      document.getElementById('active-task-label').textContent = task.label;

      const unlockedKeys = Object.entries(vars)
        .filter(([_, item]) => item.visible)
        .map(([k, item]) => ({ key: k, owner: item.owner }));
      const taskKeySel = document.getElementById('task-var-key');

        const prev = taskKeySel.value;
        taskKeySel.innerHTML = unlockedKeys.map(o => `<option value="${o.key}">${o.key} (${formatOwnerTag(o.owner)})</option>`).join('');
        if (unlockedKeys.some(o => o.key === prev)) taskKeySel.value = prev;
        taskKeySel.classList.remove('hidden');
      } else {
        taskKeySel.classList.add('hidden');
      }

      if (lastRenderedTaskEndAt !== task.end_at) {
        lastRenderedTaskEndAt = task.end_at;
        clearInterval(taskTickInterval);
        const cdEl = document.getElementById('active-task-countdown');

        const updateClock = () => {
          const remainSec = Math.max(0, Math.ceil((task.end_at - Date.now()) / 1000));
          const m = String(Math.floor(remainSec / 60)).padStart(2, '0');
          const s = String(remainSec % 60).padStart(2, '0');
          cdEl.textContent = remainSec > 0 ? `${m}:${s}` : '已完成';
          if (remainSec <= 0) {
            clearInterval(taskTickInterval);
            settleRow.classList.remove('hidden');
            if (vibratedTaskEndAt !== task.end_at) {
              vibratedTaskEndAt = task.end_at;
              triggerGentleVibrate();
            }
          }
        };
        updateClock();
        taskTickInterval = setInterval(updateClock, 500);
      }
    }

    window.submitTaskCompletion = async function(stepDelta = 0) {
      if (!gameState) return;
      let nextVars = normalizeVars(gameState.variables);
      const keyEl = document.getElementById('task-var-key');
      if (stepDelta !== 0 && keyEl && keyEl.value) {
        nextVars = applyStepDelta(nextVars, keyEl.value, stepDelta);

      const curAlert = gameState.remote_alert || {};
      const newLogs = [...(gameState.story_log || []), { type: 'sys', text: `✓ ${myName} 完成了限时指令` }];
      const activeScript = allScripts.find(s => s.id === gameState.active_script_id);
      const nextNodeId = checkNodeTriggers(activeScript, gameState.current_node_id, nextVars, newLogs);

      const { data } = await db.from('game_state').update({
        current_node_id: nextNodeId,
        variables: nextVars,
        story_log: newLogs,
        remote_alert: { ...curAlert, active_task: null, text: `${myName} 完成了限时指令`, sender: myName },
        updated_at: new Date().toISOString()
      }).eq('id', 1).select().single();

      document.getElementById('task-settle-row').classList.add('hidden');
      if (data) { gameState = data; renderAll(); }
    };

    function formatChoiceDisplay(choice) {
      if (!choice) return '';
      if (choice.reply && choice.reply !== choice.label) {
        return `${choice.label}「${choice.reply}」`;
      }
      return choice.label;
    }

    function renderAll() {
      if (!gameState) return;

      const alertObj = gameState.remote_alert || {};
      const banner = document.getElementById('remote-banner');
      if (alertObj.text && alertObj.sender !== myName) {
        banner.classList.remove('hidden');
        document.getElementById('remote-banner-text').textContent = `[${alertObj.sender}] ${alertObj.text}`;
      } else {
        banner.classList.add('hidden');
      }

      const activeScript = allScripts.find(s => s.id === gameState.active_script_id);
      const pickerCard = document.getElementById('script-picker-card');
      const togglePickerBtn = document.getElementById('btn-toggle-picker');
      const prologueView = document.getElementById('prologue-view');
      const stageView = document.getElementById('stage-view');

      if (!activeScript) {
        pickerCard.classList.remove('hidden');
        togglePickerBtn.classList.add('hidden');
        prologueView.classList.add('hidden');
        stageView.classList.add('hidden');
        return;
      }

      pickerCard.classList.add('hidden');
      togglePickerBtn.classList.remove('hidden');

      const meta = (activeScript.nodes && activeScript.nodes._meta) ? activeScript.nodes._meta : {};

      if (gameState.current_node_id === 'prologue') {
        prologueView.classList.remove('hidden');
        stageView.classList.add('hidden');
        document.getElementById('prologue-title').textContent = activeScript.title;
        document.getElementById('prologue-bg').textContent = meta.background || activeScript.summary || '';
        const roleBox = document.getElementById('prologue-role');
        const myRoleDesc = myRole === 'female' ? meta.female_role : meta.male_role;
        if (myRoleDesc) {
          roleBox.classList.remove('hidden');
          roleBox.textContent = myRoleDesc;
        } else {
          roleBox.classList.add('hidden');
        }
        return;
      }

      prologueView.classList.add('hidden');
      stageView.classList.remove('hidden');
      document.getElementById('active-script-title').textContent = activeScript.title;

      const vars = normalizeVars(gameState.variables);
      renderActiveTaskBanner(vars);

      const allUnlockedVars = Object.entries(vars).filter(([_, item]) => item.visible);
      const moodBadgesEl = document.getElementById('mood-badges');
      if (allUnlockedVars.length > 0) {
        moodBadgesEl.classList.remove('hidden');
        moodBadgesEl.innerHTML = allUnlockedVars.map(([k, item]) => {
          const stageText = getFuzzyStageLabel(item);
          const ownerCls = item.owner === 'female' ? 'owner-female' : (item.owner === 'male' ? 'owner-male' : '');
          const ownerTag = item.owner === 'both' ? '' : `<span class="mood-owner-tag">[${formatOwnerTag(item.owner)}]</span>`;
          return `<span class="mood-pill ${ownerCls}"><span class="stage-dot"></span>${ownerTag}${k}：${stageText}</span>`;
        }).join('');
      } else {
        moodBadgesEl.classList.add('hidden');
      }

      const node = activeScript.nodes ? activeScript.nodes[gameState.current_node_id] : null;
      const qrBar = document.getElementById('quick-replies-bar');
      currentNodeChoiceCache = [];
      let chipsHtml = '';

      if (node && Array.isArray(node.choices)) {
        currentNodeChoiceCache = node.choices.filter(c => !c.actor || c.actor === 'both' || c.actor === myRole);
        const roleChipCls = myRole === 'female' ? 'female-chip' : 'male-chip';
        chipsHtml += currentNodeChoiceCache.map((c, idx) => {
          const disp = formatChoiceDisplay(c);
          return `<span class="quick-chip ${roleChipCls}" onclick="pickScriptChoiceToInput(${idx})">${disp}</span>`;
        }).join('');
      }

      chipsHtml += `<span class="quick-chip replied-chip" onclick="pickRepliedChip()">已回复</span>`;
      qrBar.innerHTML = chipsHtml;

      const silentBar = document.getElementById('silent-var-bar');
      const silentKeySel = document.getElementById('silent-var-key');
      if (allUnlockedVars.length > 0) {
        silentBar.classList.remove('hidden');
        const prevVal = silentKeySel.value;
        silentKeySel.innerHTML = allUnlockedVars.map(([k, item]) =>
          `<option value="${k}">${k} (${formatOwnerTag(item.owner)})</option>`
        ).join('');
        if (allUnlockedVars.some(([k]) => k === prevVal)) silentKeySel.value = prevVal;
      } else {
        silentBar.classList.add('hidden');
      }

      const logs = Array.isArray(gameState.story_log) ? gameState.story_log : [];
      const feedEl = document.getElementById('story-feed');
      feedEl.innerHTML = logs.map(item => {
        if (item.type === 'narrator') return `<div class="msg-narrator">${item.text}</div>`;
        if (item.type === 'sys') return `<div class="msg-sys">${item.text}</div>`;
        const cls = item.role === 'female' ? 'tag-f' : 'tag-m';
        const boxCls = item.role === 'female' ? 'female-msg' : 'male-msg';
        return `<div class="msg-player ${boxCls}"><span class="${cls}">[${item.actor}]</span>${item.text}</div>`;
      }).join('');
      feedEl.scrollTop = feedEl.scrollHeight;
      updateStoryScrollFade();
    }

    // 点选剧本原有选项胶囊：仅填入聊天框，不触发 inp.focus()，防止手机软键盘自动弹出
    window.pickScriptChoiceToInput = function(idx) {
      const choice = currentNodeChoiceCache[idx];
      if (!choice) return;
      selectedScriptChoice = choice;
      const inp = document.getElementById('custom-msg-input');
      inp.value = formatChoiceDisplay(choice);
      inp.blur();
    };

    // 点选“已回复”胶囊：仅填入聊天框，不触发 inp.focus()，防止手机软键盘自动弹出
    window.pickRepliedChip = function() {
      selectedScriptChoice = null;
      const inp = document.getElementById('custom-msg-input');
      inp.value = '已回复';
      inp.blur();
    };

    window.onCustomInputTyped = function() {
      if (!selectedScriptChoice) return;
      const inp = document.getElementById('custom-msg-input');
      if (inp.value.trim() !== formatChoiceDisplay(selectedScriptChoice)) {
        selectedScriptChoice = null;
      }
    };

    window.sendCustomMessage = async function() {
      const inp = document.getElementById('custom-msg-input');
      const txt = inp.value.trim();
      if (!txt || !gameState) return;
      inp.value = '';
      inp.blur();

      const activeScript = allScripts.find(s => s.id === gameState.active_script_id);
      let nextVars = normalizeVars(gameState.variables);
      const logs = Array.isArray(gameState.story_log) ? gameState.story_log : [];
      const newLogs = [...logs, { type: 'player', actor: myName, role: myRole, text: txt }];
      let nextNodeId = gameState.current_node_id;

      if (selectedScriptChoice && txt === formatChoiceDisplay(selectedScriptChoice)) {
        const choice = selectedScriptChoice;
        selectedScriptChoice = null;

        if (choice.effects) {
          Object.entries(choice.effects).forEach(([k, d]) => {
            if (!nextVars[k]) nextVars[k] = { val: 0, max: 100, owner: 'both', visible: true, trend: 'up' };
            nextVars[k].val = Math.max(0, Math.min(nextVars[k].max, nextVars[k].val + Number(d)));
          });
        }

        if (choice.next && activeScript && activeScript.nodes && activeScript.nodes[choice.next]) {
          nextNodeId = choice.next;
          const nextNode = activeScript.nodes[choice.next];
          if (Array.isArray(nextNode.unlock_vars)) {
            nextNode.unlock_vars.forEach(k => { if (nextVars[k]) nextVars[k].visible = true; });
          }
          newLogs.push(...nodeToLogEntries(nextNode));
        }
      } else {
        selectedScriptChoice = null;
        nextNodeId = checkNodeTriggers(activeScript, gameState.current_node_id, nextVars, newLogs);
      }

      const payload = {
        current_node_id: nextNodeId,
        story_log: newLogs,
        variables: nextVars,
        updated_at: new Date().toISOString()
      };
      const { data } = await db.from('game_state').update(payload).eq('id', 1).select().single();
      if (data) { gameState = data; renderAll(); }
    };

    window.stepAdjustVar = async function(delta) {
      if (!gameState) return;
      const keyEl = document.getElementById('silent-var-key');
      if (!keyEl || !keyEl.value) return;

      const activeScript = allScripts.find(s => s.id === gameState.active_script_id);
      let nextVars = normalizeVars(gameState.variables);
      nextVars = applyStepDelta(nextVars, keyEl.value, delta);

      const newLogs = [...(gameState.story_log || [])];
      const nextNodeId = checkNodeTriggers(activeScript, gameState.current_node_id, nextVars, newLogs);

      const { data } = await db.from('game_state').update({
        current_node_id: nextNodeId,
        variables: nextVars,
        story_log: newLogs,
        updated_at: new Date().toISOString()
      }).eq('id', 1).select().single();
      if (data) { gameState = data; renderAll(); }
    };

    // ==================== 存档与读档 ====================
    window.quickSaveProgress = async function() {
      if (!gameState || !gameState.active_script_id) return alert('当前没有进行中的剧本');
      const activeScript = allScripts.find(s => s.id === gameState.active_script_id);
      const defaultName = `${activeScript ? activeScript.title : '存档'} · ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
      const title = prompt('输入存档名称：', defaultName);
      if (title === null) return;

      const snapshot = {
        script_id: gameState.active_script_id,
        node_id: gameState.current_node_id,
        variables: gameState.variables,
        story_log: gameState.story_log
      };
      const { error } = await db.from('session_archives').insert([{ title: title.trim() || defaultName, logs: snapshot }]);
      if (error) alert('存档失败：' + error.message);
      else alert('进度已保存');
    };

    window.toggleLoadPanel = async function() {
      const panel = document.getElementById('load-panel');
      panel.classList.toggle('hidden');
      if (!panel.classList.contains('hidden')) {
        const { data } = await db.from('session_archives').select('*').order('created_at', { ascending: false });
        const listEl = document.getElementById('archives-list');
        if (!data || !data.length) {
          listEl.innerHTML = '暂无存档';
          return;
        }
        listEl.innerHTML = data.map(item => {
          const isSnapshot = item.logs && !Array.isArray(item.logs) && item.logs.script_id;
          const previewLogs = isSnapshot ? (item.logs.story_log || []) : (Array.isArray(item.logs) ? item.logs : []);
          return `
            <div style="background:#1c1c26; padding:10px; border-radius:8px; margin-bottom:8px;">
              <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                <span style="color:#f472b6; font-weight:600;">${item.title}</span>
                <div style="display:flex; gap:6px;">
                  ${isSnapshot ? `<button class="btn-accent" style="padding:4px 10px; font-size:12px;" onclick='loadSnapshot(${JSON.stringify(item.logs).replace(/'/g, "&#39;")})'>读取继续</button>` : ''}
                  <button class="btn-danger" style="padding:4px 8px; font-size:12px;" onclick="deleteArchive('${item.id}')">删</button>
                </div>
              </div>
              <div style="font-size:12px; color:#a1a1aa; max-height:70px; overflow-y:auto;">
                ${previewLogs.slice(-3).map(l => `<div>${l.actor ? '['+l.actor+'] ' : ''}${l.text}</div>`).join('')}
              </div>
            </div>
          `;
        }).join('');
      }
    };

    window.loadSnapshot = async function(snapshot) {
      if (!snapshot || !snapshot.script_id) return;
      selectedScriptChoice = null;
      const { data } = await db.from('game_state').update({
        active_script_id: snapshot.script_id,
        current_node_id: snapshot.node_id || 'start',
        variables: snapshot.variables || {},
        story_log: snapshot.story_log || [],
        remote_alert: { text: '', sender: '', active_task: null },
        updated_at: new Date().toISOString()
      }).eq('id', 1).select().single();
      if (data) { gameState = data; renderAll(); }
      document.getElementById('load-panel').classList.add('hidden');
    };

    window.deleteArchive = async function(id) {
      await db.from('session_archives').delete().eq('id', id);
      toggleLoadPanel(); toggleLoadPanel();
    };

    // ==================== 侧边栏工具区指令（纯震动提醒，无提示音） ====================
    window.setField = function(id, val) {
      document.getElementById(id).value = val;
    };

    window.randomizeThreeFields = function() {
      const dirSel = document.getElementById('punish-direction');
      dirSel.selectedIndex = Math.random() < 0.5 ? 0 : 1;
      document.getElementById('punish-part').value = PRESET_PARTS[Math.floor(Math.random() * PRESET_PARTS.length)];
      document.getElementById('punish-action').value = PRESET_ACTIONS[Math.floor(Math.random() * PRESET_ACTIONS.length)];
      document.getElementById('punish-time').value = PRESET_TIMES[Math.floor(Math.random() * PRESET_TIMES.length)];
    };

    function parseDurationSeconds(timeStr) {
      if (!timeStr) return 60;
      const num = parseFloat(timeStr.replace(/[^\d.]/g, ''));
      if (isNaN(num) || num <= 0) return 60;
      if (timeStr.includes('分') || timeStr.toLowerCase().includes('m')) return Math.round(num * 60);
      return Math.round(num);
    }

    window.dispatchThreeFieldTask = async function() {
      if (!gameState) return;
      const dir = document.getElementById('punish-direction').value;
      const part = document.getElementById('punish-part').value.trim();
      const action = document.getElementById('punish-action').value.trim();
      const timeStr = document.getElementById('punish-time').value.trim();
      if (!part && !action) return alert('请至少填写或选择一个部位或动作');

      const partner = getPartnerName();
      const durationSec = parseDurationSeconds(timeStr);
      const displayTime = timeStr || `${durationSec}秒`;
      const actionDesc = action || '轻柔挑逗';

      const label = dir === 'by_partner'
        ? `【${myName} → ${partner}】让 ${partner} 对你的${part ? `【${part}】` : ''}${actionDesc}（${displayTime}）`
        : `【${myName} → ${partner}】对 ${partner} 的${part ? `【${part}】` : ''}${actionDesc}（${displayTime}）`;

      const activeTask = {
        label,
        duration_sec: durationSec,
        end_at: Date.now() + durationSec * 1000
      };

      const newLogs = [...(gameState.story_log || []), { type: 'sys', text: `⚡ ${label}` }];
      const curAlert = gameState.remote_alert || {};
      const nextAlert = { ...curAlert, active_task: activeTask, text: label, sender: myName };

      document.getElementById('task-settle-row').classList.add('hidden');
      const { data } = await db.from('game_state').update({
        story_log: newLogs,
        remote_alert: nextAlert,
        updated_at: new Date().toISOString()
      }).eq('id', 1).select().single();

      if (data) { gameState = data; renderAll(); }
      document.getElementById('side-drawer').classList.remove('open');
    };

    let standaloneTimerId = null;
    window.startStandaloneTimer = async function(sec) {
      clearInterval(standaloneTimerId);
      const disp = document.getElementById('timer-display');
      if (sec <= 0) {
        disp.textContent = '00:00';
        if (gameState) {
          const curAlert = gameState.remote_alert || {};
          const { data } = await db.from('game_state').update({
            remote_alert: { ...curAlert, active_task: null },
            updated_at: new Date().toISOString()
          }).eq('id', 1).select().single();
          if (data) { gameState = data; renderAll(); }
        }
        return;
      }
      let rem = sec;
      const tick = () => {
        disp.textContent = `${String(Math.floor(rem / 60)).padStart(2, '0')}:${String(rem % 60).padStart(2, '0')}`;
        if (rem <= 0) {
          clearInterval(standaloneTimerId);
          triggerGentleVibrate();
        }
        rem--;
      };
      tick();
      standaloneTimerId = setInterval(tick, 1000);

      if (gameState) {
        const curAlert = gameState.remote_alert || {};
        const label = `【${myName}】限时挑逗（${sec}秒）`;
        const activeTask = {
          label,
          duration_sec: sec,
          end_at: Date.now() + sec * 1000
        };
        document.getElementById('task-settle-row').classList.add('hidden');
        const { data } = await db.from('game_state').update({
          remote_alert: { ...curAlert, active_task: activeTask, text: label, sender: myName },
          updated_at: new Date().toISOString()
        }).eq('id', 1).select().single();
        if (data) { gameState = data; renderAll(); }
        document.getElementById('side-drawer').classList.remove('open');
      }
    };

    // 律动节拍器（纯视觉呼吸灯 + 轻柔震动反馈，无提示音）
    let beatId = null, beatOn = false, currentBpm = 60;
    function pulseBeat() {
      const dot = document.getElementById('beat-dot');
      if (dot) {
        dot.classList.add('pulse');
        setTimeout(() => dot.classList.remove('pulse'), 90);
      }
      try {
        if (navigator && typeof navigator.vibrate === 'function') navigator.vibrate(45);
      } catch (e) {}
    }
    function runBeat() {
      clearInterval(beatId);
      if (!beatOn) return;
      beatId = setInterval(pulseBeat, Math.round(60000 / currentBpm));
    }
    window.changeBpm = function(v) { currentBpm = Number(v); document.getElementById('bpm-val').textContent = v; if (beatOn) runBeat(); };
    window.toggleBeat = function() {
      beatOn = !beatOn;
      document.getElementById('btn-beat').textContent = beatOn ? '停止' : '启动';
      if (beatOn) runBeat(); else clearInterval(beatId);
    };

    window.sendCustomCmd = async function() {
      const inp = document.getElementById('custom-cmd-input');
      const txt = inp.value.trim();
      if (!txt || !gameState) return;
      inp.value = '';
      const newLogs = [...(gameState.story_log || []), { type: 'sys', text: `【指令】${txt}` }];
      const curAlert = gameState.remote_alert || {};
      const payload = {
        story_log: newLogs,
        remote_alert: { ...curAlert, text: txt, sender: myName },
        updated_at: new Date().toISOString()
      };
      const { data } = await db.from('game_state').update(payload).eq('id', 1).select().single();
      if (data) { gameState = data; renderAll(); }
      document.getElementById('side-drawer').classList.remove('open');
    };

    window.triggerSafeWord = async function() {
      if (!gameState) return;
      const txt = '🛑 【红灯暂停】节奏暂缓，先拥抱彼此平复呼吸。';
      const newLogs = [...(gameState.story_log || []), { type: 'sys', text: txt }];
      const curAlert = gameState.remote_alert || {};
      const payload = {
        story_log: newLogs,
        remote_alert: { ...curAlert, active_task: null, text: txt, sender: myName },
        updated_at: new Date().toISOString()
      };
      const { data } = await db.from('game_state').update(payload).eq('id', 1).select().single();
      if (data) { gameState = data; renderAll(); }
      document.getElementById('side-drawer').classList.remove('open');
    };

    window.finishSession = async function(shouldSave) {
      hasExplicitlyFinished = true;
      clearInterval(beatId);
      clearInterval(syncPollTimer);
      clearInterval(taskTickInterval);
      if (shouldSave && gameState && gameState.active_script_id) {
        const title = document.getElementById('archive-title-input').value.trim() || new Date().toLocaleString();
        const snapshot = {
          script_id: gameState.active_script_id,
          node_id: gameState.current_node_id,
          variables: gameState.variables,
          story_log: gameState.story_log
        };
        await db.from('session_archives').insert([{ title, logs: snapshot }]);
      }
      await db.from('game_state').update({
        active_script_id: null, story_log: [], variables: {}, current_node_id: 'start', remote_alert: { text: '', sender: '', active_task: null }, updated_at: new Date().toISOString()
      }).eq('id', 1);
      await db.auth.signOut();
      location.reload();
    };
  </script>
</body>
</html>
