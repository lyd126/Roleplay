<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Session</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #09090d; color: #e4e4e7; min-height: 100vh;
      display: flex; justify-content: center; padding: 16px; overflow-x: hidden;
    }

    .app-shell { width: 100%; max-width: 680px; display: flex; flex-direction: column; gap: 14px; }
    @media (min-width: 840px) {
      body { padding: 28px; }
      .app-shell { max-width: 780px; }
      .story-feed { max-height: 55vh !important; }
    }

    .card { background: #14141b; border: 1px solid #242432; border-radius: 14px; padding: 20px; }
    .hidden { display: none !important; }

    select, input, textarea {
      width: 100%; padding: 11px 13px; border: 1px solid #2c2c3c; border-radius: 9px;
      background: #0d0d12; color: #f4f4f5; font-size: 15px; outline: none;
    }
    select:focus, input:focus, textarea:focus { border-color: #db2777; }

    button {
      padding: 11px 15px; border: none; border-radius: 9px; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: opacity 0.15s;
      white-space: nowrap; flex-shrink: 0;
    }
    .btn-accent { background: linear-gradient(135deg, #9333ea, #db2777); color: #fff; }
    .btn-ghost { background: #1c1c26; border: 1px solid #2c2c3c; color: #cbd5e1; }
    .btn-danger { background: rgba(225, 29, 72, 0.15); border: 1px solid #be123c; color: #fda4af; }

    /* 登录页异地开关与在线提示 */
    .login-remote-row {
      display: flex; justify-content: space-between; align-items: center;
      background: #0d0d12; border: 1px solid #2c2c3c; border-radius: 9px; padding: 10px 13px;
      font-size: 14px; color: #cbd5e1;
    }
    .login-hint {
      font-size: 12.5px; color: #f472b6; text-align: center; min-height: 18px;
    }
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0; background-color: #2e2e3e; transition: .25s; border-radius: 24px;
    }
    .slider:before {
      position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
      background-color: white; transition: .25s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #db2777; }
    input:checked + .slider:before { transform: translateX(20px); }

    /* 顶部栏 */
    .top-bar { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }
    .presence { display: flex; gap: 6px; align-items: center; }
    .pill {
      display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px;
      border-radius: 99px; font-size: 12.5px; background: #1a1a22; color: #71717a;
    }
    .pill.on { background: rgba(219, 39, 119, 0.18); color: #f472b6; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #52525b; }
    .pill.on .dot { background: #ec4899; box-shadow: 0 0 6px #ec4899; }

    .remote-banner {
      background: linear-gradient(135deg, rgba(147, 51, 234, 0.25), rgba(219, 39, 119, 0.25));
      border: 1px solid #ec4899; border-radius: 12px; padding: 12px 15px;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }

    /* 背景引入页 */
    .prologue-box {
      background: linear-gradient(180deg, #1b1624 0%, #14141b 100%);
      border: 1px solid #362542; border-radius: 16px; padding: 28px 24px;
      display: flex; flex-direction: column; gap: 18px;
    }
    .prologue-title { font-size: 22px; font-weight: 800; color: #f472b6; letter-spacing: 1px; text-align: center; }
    .prologue-text { font-size: 16px; line-height: 1.85; color: #e4e4e7; white-space: pre-line; }
    .role-card {
      background: rgba(255, 255, 255, 0.03); border-left: 3px solid #9333ea;
      padding: 14px 16px; border-radius: 8px; font-size: 15px; line-height: 1.75; color: #d8b4fe;
    }

    /* 模糊阶段氛围刻度 */
    .mood-badges {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px;
    }
    .mood-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 8px; font-size: 12.5px;
      background: #1b1824; border: 1px solid #2f2640; color: #e9d5ff;
    }
    .mood-pill .stage-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #ec4899;
    }

    /* 剧情流 */
    .story-feed { display: flex; flex-direction: column; gap: 14px; max-height: 50vh; overflow-y: auto; padding-right: 4px; }
    .msg-narrator {
      background: #1c1726; border-left: 3px solid #db2777; padding: 15px 18px;
      border-radius: 10px; font-size: 16px; line-height: 1.85; color: #f4f4f5;
    }
    .msg-player { background: #1a1a23; padding: 11px 15px; border-radius: 10px; font-size: 15.5px; line-height: 1.65; }
    .msg-player .tag-f { color: #f472b6; font-weight: 700; margin-right: 7px; }
    .msg-player .tag-m { color: #818cf8; font-weight: 700; margin-right: 7px; }
    .msg-sys { text-align: center; font-size: 13.5px; color: #c084fc; padding: 4px 0; }

    /* 缩进式选项区 */
    .choices-wrapper {
      margin-top: 16px; margin-left: 14px; padding-left: 14px;
      border-left: 2px solid #322642; display: flex; flex-direction: column; gap: 10px;
    }
    .btn-choice {
      width: 100%; background: linear-gradient(135deg, #241f31 0%, #1d1b28 100%);
      border: 1px solid #482b4e; color: #fff; text-align: left;
      padding: 13px 16px; font-size: 15px; line-height: 1.55;
      white-space: normal; box-shadow: 0 3px 10px rgba(0, 0, 0, 0.22);
    }
    .btn-choice:hover { border-color: #ec4899; background: #2d2138; }
    .btn-continue {
      width: 100%; background: #221d2e; border: 1px solid #7e22ce; color: #e9d5ff;
      text-align: center; padding: 12px; font-size: 14.5px; white-space: normal;
    }
    .wait-tip {
      text-align: center; padding: 13px; background: #181822; border-radius: 10px;
      font-size: 14px; color: #71717a; border: 1px dashed #2e2e3e;
    }

    /* 快捷常用回复 */
    .quick-replies { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
    .quick-chip {
      background: #1b1a24; border: 1px solid #322e42; color: #d4d4d8;
      padding: 5px 12px; border-radius: 99px; font-size: 13px; font-weight: 500;
      cursor: pointer; transition: border-color 0.15s, color 0.15s;
    }
    .quick-chip:hover { border-color: #db2777; color: #f472b6; }

    /* 隐蔽式数值微调栏 */
    .silent-var-bar { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
    .silent-var-bar select { flex: 1.2; padding: 8px 10px; font-size: 13px; color: #a1a1aa; }
    .silent-var-bar input { flex: 1; padding: 8px 10px; font-size: 13px; }

    /* 固定侧边栏触发器 */
    .drawer-tab {
      position: fixed; right: 0; top: 180px;
      background: #222230; border: 1px solid #3b3b50; border-right: none;
      color: #f472b6; padding: 12px 7px; border-radius: 10px 0 0 10px;
      writing-mode: vertical-rl; font-size: 12px; letter-spacing: 2px; z-index: 40; cursor: pointer;
    }
    .side-drawer {
      position: fixed; right: 0; top: 0; bottom: 0; width: 280px;
      background: #13131a; border-left: 1px solid #2c2c3c; padding: 18px 15px;
      z-index: 60; display: flex; flex-direction: column; gap: 12px; overflow-y: auto;
      transform: translateX(100%); transition: transform 0.22s ease;
    }
    .side-drawer.open { transform: translateX(0); }
    .tool-box { background: #1a1a24; padding: 12px; border-radius: 10px; display: flex; flex-direction: column; gap: 8px; }
    .beat-dot { width: 12px; height: 12px; border-radius: 50%; background: #52525b; display: inline-block; transition: transform 0.08s; }
    .beat-dot.pulse { background: #ec4899; transform: scale(1.4); box-shadow: 0 0 10px #ec4899; }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.84);
      display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100;
    }
  </style>
</head>
<body>

  <!-- 登录页 -->
  <div id="login-view" class="app-shell" style="max-width: 360px; justify-content: center;">
    <div class="card" style="display: flex; flex-direction: column; gap: 12px;">
      <select id="player-select">
        <option value="yc@play.game" selected>YC</option>
        <option value="ly@play.game">LY</option>
      </select>
      <div id="login-presence-hint" class="login-hint hidden"></div>
      <input type="password" id="password-input" placeholder="Password" onkeypress="if(event.key==='Enter') document.getElementById('login-btn').click()" />
      <div class="login-remote-row">
        <span>异地模式</span>
        <label class="switch">
          <input type="checkbox" id="login-remote-checkbox" />
          <span class="slider"></span>
        </label>
      </div>
      <button id="login-btn" class="btn-accent">Enter</button>
      <p id="login-error" style="color:#fb7185; font-size:13px; text-align:center;"></p>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="app-view" class="app-shell hidden">
    <div class="top-bar">
      <div class="presence">
        <div id="pill-yc" class="pill"><span class="dot"></span>YC</div>
        <div id="pill-ly" class="pill"><span class="dot"></span>LY</div>
      </div>
      <div style="display: flex; gap: 5px; flex-wrap: wrap;">
        <button id="btn-toggle-picker" class="btn-ghost hidden" onclick="toggleScriptPicker()">换本</button>
        <button class="btn-ghost" onclick="togglePanel('upload-panel')">+ 剧本</button>
        <button class="btn-ghost" onclick="quickSaveProgress()">存档</button>
        <button class="btn-ghost" onclick="toggleLoadPanel()">读档</button>
        <button class="btn-danger" onclick="document.getElementById('exit-modal').classList.remove('hidden')">退出</button>
      </div>
    </div>

    <!-- 异地指令提示条 -->
    <div id="remote-banner" class="remote-banner hidden">
      <div id="remote-banner-text" style="font-size: 14.5px; color: #fff; line-height: 1.5;"></div>
      <button class="btn-accent" style="padding: 6px 12px; font-size: 12.5px;" onclick="ackRemoteAlert()">收到</button>
    </div>

    <!-- 选本栏 -->
    <div id="script-picker-card" class="card" style="display: flex; gap: 6px;">
      <select id="script-selector" style="flex: 1; min-width: 0;"></select>
      <button class="btn-accent" onclick="startSelectedScript()">开始</button>
      <button class="btn-ghost" onclick="startRandomScript()">🎲</button>
      <button class="btn-danger" onclick="deleteSelectedScript()">删除</button>
    </div>

    <!-- 上传剧本 -->
    <div id="upload-panel" class="card hidden" style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; gap: 8px;">
        <input type="text" id="new-script-title" placeholder="剧本名称" style="flex: 2;" />
        <select id="new-script-type" style="flex: 1;">
          <option value="conquest">攻略</option>
          <option value="edging">节奏</option>
          <option value="domsub">支配</option>
          <option value="story">剧情</option>
        </select>
      </div>
      <textarea id="new-script-json" rows="5" placeholder="JSON 内容"></textarea>
      <button class="btn-accent" onclick="saveNewScript()">保存至云端</button>
    </div>

    <!-- 读档列表 -->
    <div id="load-panel" class="card hidden" style="display: flex; flex-direction: column; gap: 8px;">
      <div id="archives-list" style="font-size: 13.5px; color: #a1a1aa;"></div>
    </div>

    <!-- 阶段 0：背景引入页 -->
    <div id="prologue-view" class="prologue-box hidden">
      <div class="prologue-title" id="prologue-title"></div>
      <div class="prologue-text" id="prologue-bg"></div>
      <div class="role-card" id="prologue-role"></div>
      <button class="btn-accent" style="padding: 13px; font-size: 15.5px; margin-top: 6px;" onclick="enterFirstScene()">进入角色 · 开启今夜</button>
    </div>

    <!-- 阶段 1：正戏舞台 -->
    <div id="stage-view" class="card hidden" style="display: flex; flex-direction: column;">
      <div id="active-script-title" style="font-size: 15px; font-weight: 700; color: #f472b6; margin-bottom: 8px;"></div>

      <div id="mood-badges" class="mood-badges hidden"></div>

      <div class="story-feed" id="story-feed"></div>

      <div class="choices-wrapper" id="choices-wrapper">
        <div id="choices-box" style="display: flex; flex-direction: column; gap: 9px;"></div>
      </div>

      <div style="margin-top: 16px; padding-top: 14px; border-top: 1px solid #242432;">
        <div style="display: flex; gap: 8px; align-items: center;">
          <input type="text" id="custom-msg-input" style="flex: 1; min-width: 0;" placeholder="输入台词或动作..." onkeypress="if(event.key==='Enter') sendCustomMessage()" />
          <button class="btn-accent" style="padding: 11px 18px;" onclick="sendCustomMessage()">发送</button>
        </div>

        <div id="quick-replies-bar" class="quick-replies"></div>

        <div id="silent-var-bar" class="silent-var-bar hidden">
          <select id="silent-var-key"></select>
          <input type="number" id="silent-var-val" min="0" max="100" placeholder="可选：设定数值(0-100)" />
        </div>
      </div>
    </div>
  </div>

  <!-- 固定位置侧边栏触发器 -->
  <button id="drawer-tab" class="drawer-tab hidden" onclick="document.getElementById('side-drawer').classList.add('open')">工具</button>
  <div id="side-drawer" class="side-drawer">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span style="font-weight:700; color:#f472b6; font-size:14px;">辅助</span>
      <button class="btn-ghost" style="padding:5px 10px; font-size:12px;" onclick="document.getElementById('side-drawer').classList.remove('open')">收起</button>
    </div>

    <div class="tool-box">
      <span style="font-size:12px; color:#a1a1aa;">氛围盲盒</span>
      <button class="btn-accent" style="font-size:12.5px;" onclick="drawBodyActionCombo()">抽取互动指令</button>
    </div>

    <div class="tool-box">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:12px; color:#a1a1aa;">计时</span>
        <strong id="timer-display" style="color:#f472b6; font-size:18px;">00:00</strong>
      </div>
      <div style="display:flex; gap:4px;">
        <button class="btn-ghost" style="flex:1; padding:6px; font-size:12px;" onclick="startTimer(30)">30s</button>
        <button class="btn-ghost" style="flex:1; padding:6px; font-size:12px;" onclick="startTimer(60)">60s</button>
        <button class="btn-ghost" style="flex:1; padding:6px; font-size:12px;" onclick="startTimer(180)">3m</button>
        <button class="btn-ghost" style="flex:1; padding:6px; font-size:12px;" onclick="startTimer(0)">停</button>
      </div>
    </div>

    <div class="tool-box">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div style="display:flex; align-items:center; gap:6px;">
          <span id="beat-dot" class="beat-dot"></span>
          <span style="font-size:12px; color:#a1a1aa;"><span id="bpm-val">60</span> BPM</span>
        </div>
        <button id="btn-beat" class="btn-ghost" style="padding:4px 10px; font-size:12px;" onclick="toggleBeat()">启动</button>
      </div>
      <input type="range" id="bpm-slider" min="30" max="160" value="60" style="padding:0;" oninput="changeBpm(this.value)" />
    </div>

    <div class="tool-box">
      <button class="btn-ghost" style="font-size:12.5px;" onclick="drawRandomPenalty()">随机小惩罚</button>
      <div style="display:flex; gap:6px;">
        <input type="text" id="custom-cmd-input" style="flex:1; min-width:0; font-size:12.5px; padding:8px;" placeholder="自定义指令..." />
        <button class="btn-ghost" style="padding:8px 12px; font-size:12px;" onclick="sendCustomCmd()">发</button>
      </div>
    </div>

    <button class="btn-danger" style="font-size:12.5px;" onclick="triggerSafeWord()">红灯暂停 · 抱抱喘息</button>
  </div>

  <!-- 退出弹窗 -->
  <div id="exit-modal" class="modal-backdrop hidden">
    <div class="card" style="max-width: 340px; width: 100%; display: flex; flex-direction: column; gap: 10px;">
      <input type="text" id="archive-title-input" placeholder="存档名称" />
      <button class="btn-accent" onclick="finishSession(true)">保存记录并退出</button>
      <button class="btn-danger" onclick="finishSession(false)">彻底删除记录并退出</button>
      <button class="btn-ghost" onclick="document.getElementById('exit-modal').classList.add('hidden')">取消</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://hciqpdghykrdctxbpwpc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_gbR5IGXPz5n1kVTEpbq7pQ_R3dPPdud';

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        persistSession: false,
        autoRefreshToken: false
      }
    });

    let myRole = '', myName = '', allScripts = [], gameState = null;
    let currentAccessToken = '';
    let hasExplicitlyFinished = false;
    let isRemoteSession = false;
    let roomChannel = null;
    let syncPollTimer = null;
    let userManuallyChangedSelect = false;

    const SHORT_QUICK_REPLIES = {
      female: ['好的', '不要', '继续', '慢一点', '过来', '随你', '再靠近些', '停一下'],
      male: ['好的', '遵命', '继续', '慢一点', '可以吗', '忍住了', '都听你的', '抱紧你']
    };

    const BODY_PARTS = ['耳垂与颈侧', '锁骨窝', '掌心与指尖', '腰窝', '额头与眉心'];
    const ACTIONS = ['凑近低语 30 秒', '轻柔抚摸并深呼吸', '对视 20 秒不许移开视线', '用指腹轻划皮肤', '贴紧相拥感受心跳'];

    const PENALTIES = [
      '【指令】保持当前姿势静止 60 秒，专注感受彼此呼吸。',
      '【指令】闭上眼睛，接下来 2 分钟完全交由对方引导。',
      '【惩罚】轻刮对方鼻尖并说一句最肉麻的情话。',
      '【惩罚】主动献上一个长达 30 秒的深吻。',
      '【惩罚】坦白此刻心里最真实的一个念头。',
      '【指令】暂停所有动作深呼吸 30 秒，平复心跳。'
    ];

    document.getElementById('player-select').addEventListener('change', () => {
      userManuallyChangedSelect = true;
    });

    (function initPreLoginPresence() {
      const lobbyProbe = db.channel('room-1');
      lobbyProbe
        .on('presence', { event: 'sync' }, () => {
          const online = new Set();
          Object.values(lobbyProbe.presenceState()).forEach(arr => arr.forEach(s => s.player && online.add(s.player)));
          const sel = document.getElementById('player-select');
          const hint = document.getElementById('login-presence-hint');

          if (!userManuallyChangedSelect) {
            if (online.has('YC') && !online.has('LY')) {
              sel.value = 'ly@play.game';
              hint.textContent = 'YC 已在线，已自动切换为 LY';
              hint.classList.remove('hidden');
            } else if (online.has('LY') && !online.has('YC')) {
              sel.value = 'yc@play.game';
              hint.textContent = 'LY 已在线，已默认选中 YC';
              hint.classList.remove('hidden');
            } else {
              sel.value = 'yc@play.game';
              hint.classList.add('hidden');
            }
          }
        })
        .subscribe();
    })();

    window.addEventListener('pagehide', () => {
      if (!currentAccessToken || hasExplicitlyFinished || !gameState) return;
      const headers = {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${currentAccessToken}`
      };

      if (Array.isArray(gameState.story_log) && gameState.story_log.length > 0) {
        const snapshot = {
          script_id: gameState.active_script_id,
          node_id: gameState.current_node_id,
          variables: gameState.variables,
          story_log: gameState.story_log
        };
        fetch(`${SUPABASE_URL}/rest/v1/session_archives`, {
          method: 'POST',
          keepalive: true,
          headers,
          body: JSON.stringify({ title: `自动存档 ${new Date().toLocaleString()}`, logs: snapshot })
        });
      }

      fetch(`${SUPABASE_URL}/rest/v1/game_state?id=eq.1`, {
        method: 'PATCH',
        keepalive: true,
        headers,
        body: JSON.stringify({
          active_script_id: null,
          story_log: [],
          variables: {},
          current_node_id: 'start',
          remote_alert: { text: '', sender: '' }
        })
      });
    });

    document.getElementById('login-btn').addEventListener('click', async () => {
      const email = document.getElementById('player-select').value;
      const password = document.getElementById('password-input').value;
      isRemoteSession = document.getElementById('login-remote-checkbox').checked;
      const { data, error } = await db.auth.signInWithPassword({ email, password });
      if (error) document.getElementById('login-error').textContent = error.message;
      else initSession(data.session);
    });

    async function initSession(session) {
      currentAccessToken = session.access_token;
      const email = session.user.email;
      myName = email.startsWith('yc') ? 'YC' : 'LY';
      myRole = email.startsWith('yc') ? 'female' : 'male';

      document.getElementById('login-view').classList.add('hidden');
      document.getElementById('app-view').classList.remove('hidden');
      document.getElementById('drawer-tab').classList.remove('hidden');

      await loadScripts();
      const { data } = await db.from('game_state').select('*').eq('id', 1).single();
      gameState = data;
      renderAll();

      // 关键修复 1：移除登录前的匿名频道，并为 Realtime 注入已登录用户的 JWT Token
      await db.removeAllChannels();
      db.realtime.setAuth(session.access_token);

      roomChannel = db.channel('room-1', { config: { presence: { key: myName } } });
      roomChannel
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'game_state', filter: 'id=eq.1' }, async (payload) => {
          gameState = payload.new;
          if (gameState.active_script_id && !allScripts.find(s => s.id === gameState.active_script_id)) await loadScripts();
          renderAll();
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'scripts' }, async () => {
          await loadScripts();
          renderAll();
        })
        .on('presence', { event: 'sync' }, () => {
          const online = new Set();
          Object.values(roomChannel.presenceState()).forEach(arr => arr.forEach(s => s.player && online.add(s.player)));
          ['YC', 'LY'].forEach(n => document.getElementById(`pill-${n.toLowerCase()}`).classList.toggle('on', online.has(n)));
        })
        .subscribe(async status => {
          if (status === 'SUBSCRIBED') await roomChannel.track({ player: myName });
        });

      // 关键修复 2：每 3.5 秒静默同步一次状态作为兜底，防止移动设备锁屏切后台漏掉 WebSocket 推送
      clearInterval(syncPollTimer);
      syncPollTimer = setInterval(async () => {
        const { data: latest } = await db.from('game_state').select('*').eq('id', 1).single();
        if (latest && (!gameState || latest.updated_at !== gameState.updated_at || (latest.story_log || []).length !== (gameState.story_log || []).length)) {
          gameState = latest;
          if (gameState.active_script_id && !allScripts.find(s => s.id === gameState.active_script_id)) await loadScripts();
          renderAll();
        }
      }, 3500);
    }

    async function loadScripts() {
      const { data } = await db.from('scripts').select('*').order('created_at', { ascending: false });
      allScripts = data || [];
      const sel = document.getElementById('script-selector');
      const prevSelected = sel.value;
      sel.innerHTML = allScripts.length
        ? allScripts.map(s => `<option value="${s.id}">${s.title}</option>`).join('')
        : '<option value="">暂无剧本</option>';
      if (prevSelected && allScripts.some(s => s.id === prevSelected)) {
        sel.value = prevSelected;
      } else if (gameState && gameState.active_script_id && allScripts.some(s => s.id === gameState.active_script_id)) {
        sel.value = gameState.active_script_id;
      }
    }

    function normalizeVars(rawVars) {
      const res = {};
      if (!rawVars || typeof rawVars !== 'object') return res;
      Object.entries(rawVars).forEach(([k, v]) => {
        if (typeof v === 'object' && v !== null) {
          res[k] = {
            val: Number(v.val ?? 0),
            max: Number(v.max ?? 100),
            owner: v.owner || 'both',
            visible: v.visible !== undefined ? Boolean(v.visible) : true
          };
        } else {
          res[k] = { val: Number(v ?? 0), max: 100, owner: 'both', visible: true };
        }
      });
      return res;
    }

    function getFuzzyStageLabel(key, val, max) {
      const ratio = (Number(val) || 0) / (Number(max) || 100);
      const isDescending = key.includes('防线') || key.includes('克制') || key.includes('忍耐');
      const intensity = isDescending ? (1 - ratio) : ratio;

      if (intensity < 0.25) return '初起 · 微澜';
      if (intensity < 0.50) return '渐浓 · 升温';
      if (intensity < 0.75) return '深陷 · 灼热';
      return '极致 · 临界';
    }

    function applyOptionalManualVar(varsObj) {
      const keyEl = document.getElementById('silent-var-key');
      const valEl = document.getElementById('silent-var-val');
      if (!keyEl || !valEl || valEl.value.trim() === '') return varsObj;
      const k = keyEl.value;
      const num = Number(valEl.value);
      if (!isNaN(num)) {
        if (!varsObj[k]) varsObj[k] = { val: 0, max: 100, owner: myRole, visible: true };
        varsObj[k].val = Math.max(0, Math.min(varsObj[k].max, num));
      }
      valEl.value = '';
      return varsObj;
    }

    function nodeToLogEntries(node) {
      if (!node || !node.text) return [];
      if (Array.isArray(node.text)) {
        return node.text.map(paragraph => ({ type: 'narrator', text: paragraph }));
      }
      return [{ type: 'narrator', text: node.text }];
    }

    function evaluateConditions(condList, vars) {
      if (!condList || !condList.length) return true;
      return condList.every(cond => {
        const cur = Number((vars[cond.var] || {}).val ?? 0);
        const tgt = Number(cond.val);
        if (cond.op === '>=') return cur >= tgt;
        if (cond.op === '<=') return cur <= tgt;
        if (cond.op === '>') return cur > tgt;
        if (cond.op === '<') return cur < tgt;
        if (cond.op === '==') return cur == tgt;
        return false;
      });
    }

    window.enterFirstScene = async function() {

    window.saveNewScript = async function() {
      const title = document.getElementById('new-script-title').value.trim();
      const type = document.getElementById('new-script-type').value;
      const rawJson = document.getElementById('new-script-json').value.trim();
      if (!title || !rawJson) return alert('请填写剧本名称和 JSON 内容');
      try {
        const parsed = JSON.parse(rawJson);
        const nodes = parsed.nodes ? parsed.nodes : parsed;
        const initialVars = parsed.initial_vars || {};
        const summary = parsed.background || parsed.summary || '';
        if (!nodes.start) return alert('缺少 start 节点');
        nodes._meta = {
          background: parsed.background || '',
          female_role: parsed.female_role || '',
          male_role: parsed.male_role || ''
        };
        const { error } = await db.from('scripts').insert([{ title, type, summary, initial_vars: initialVars, nodes }]);
        if (error) throw error;
        document.getElementById('new-script-title').value = '';
        document.getElementById('new-script-json').value = '';
        document.getElementById('upload-panel').classList.add('hidden');
        await loadScripts();
      } catch (e) { alert('JSON 格式有误：' + e.message); }
    };

    function renderAll() {
      if (!gameState) return;

      const alertObj = gameState.remote_alert || {};
      const banner = document.getElementById('remote-banner');
      if (isRemoteSession && alertObj.text && alertObj.sender !== myName) {
        banner.classList.remove('hidden');
        document.getElementById('remote-banner-text').textContent = `[${alertObj.sender}] ${alertObj.text}`;
      } else {
        banner.classList.add('hidden');
      }

      const activeScript = allScripts.find(s => s.id === gameState.active_script_id);
      const pickerCard = document.getElementById('script-picker-card');
      const togglePickerBtn = document.getElementById('btn-toggle-picker');
      const prologueView = document.getElementById('prologue-view');
      const stageView = document.getElementById('stage-view');

      if (!activeScript) {
        pickerCard.classList.remove('hidden');
        togglePickerBtn.classList.add('hidden');
        prologueView.classList.add('hidden');
        stageView.classList.add('hidden');
        return;
      }

      pickerCard.classList.add('hidden');
      togglePickerBtn.classList.remove('hidden');

      const meta = (activeScript.nodes && activeScript.nodes._meta) ? activeScript.nodes._meta : {};

      if (gameState.current_node_id === 'prologue') {
        prologueView.classList.remove('hidden');
        stageView.classList.add('hidden');
        document.getElementById('prologue-title').textContent = activeScript.title;
        document.getElementById('prologue-bg').textContent = meta.background || activeScript.summary || '';
        const roleBox = document.getElementById('prologue-role');
        const myRoleDesc = myRole === 'female' ? meta.female_role : meta.male_role;
        if (myRoleDesc) {
          roleBox.classList.remove('hidden');
          roleBox.textContent = myRoleDesc;
        } else {
          roleBox.classList.add('hidden');
        }
        return;
      }

      prologueView.classList.add('hidden');
      stageView.classList.remove('hidden');
      document.getElementById('active-script-title').textContent = activeScript.title;

      const vars = normalizeVars(gameState.variables);
      const myVisibleVars = Object.entries(vars).filter(([_, item]) =>
        item.visible && (item.owner === 'both' || item.owner === myRole)
      );
      const moodBadgesEl = document.getElementById('mood-badges');
      if (myVisibleVars.length > 0) {
        moodBadgesEl.classList.remove('hidden');
        moodBadgesEl.innerHTML = myVisibleVars.map(([k, item]) => {
          const stageText = getFuzzyStageLabel(k, item.val, item.max);
          return `<span class="mood-pill"><span class="stage-dot"></span>${k}：${stageText}</span>`;
        }).join('');
      } else {
        moodBadgesEl.classList.add('hidden');
      }

      const qrBar = document.getElementById('quick-replies-bar');
      const phrases = SHORT_QUICK_REPLIES[myRole] || SHORT_QUICK_REPLIES.female;
      qrBar.innerHTML = phrases.map(p =>
        `<span class="quick-chip" onclick="fillQuickReply('${p}')">${p}</span>`
      ).join('');

      const editableKeys = myVisibleVars.map(([k]) => k);
      const silentBar = document.getElementById('silent-var-bar');
      const silentKeySel = document.getElementById('silent-var-key');
      if (editableKeys.length > 0) {
        silentBar.classList.remove('hidden');
        const prevVal = silentKeySel.value;
        silentKeySel.innerHTML = editableKeys.map(k => `<option value="${k}">指标：${k}</option>`).join('');
        if (editableKeys.includes(prevVal)) silentKeySel.value = prevVal;
      } else {
        silentBar.classList.add('hidden');
      }

      const logs = Array.isArray(gameState.story_log) ? gameState.story_log : [];
      const feedEl = document.getElementById('story-feed');
      feedEl.innerHTML = logs.map(item => {
        if (item.type === 'narrator') return `<div class="msg-narrator">${item.text}</div>`;
        if (item.type === 'sys') return `<div class="msg-sys">${item.text}</div>`;
        const cls = item.role === 'female' ? 'tag-f' : 'tag-m';
        return `<div class="msg-player"><span class="${cls}">[${item.actor}]</span>${item.text}</div>`;
      }).join('');
      feedEl.scrollTop = feedEl.scrollHeight;

      const node = activeScript.nodes ? activeScript.nodes[gameState.current_node_id] : null;
      const choicesWrapper = document.getElementById('choices-wrapper');
      const choicesEl = document.getElementById('choices-box');
      choicesEl.innerHTML = '';

      let hasRenderedControls = false;

      if (node) {
        const hasChoices = Array.isArray(node.choices) && node.choices.length > 0;
        if (!hasChoices && node.next) {
          hasRenderedControls = true;
          const contBtn = document.createElement('button');
          contBtn.className = 'btn-continue';
          contBtn.textContent = node.continue_label || '继续剧情 ▾';
          contBtn.onclick = async () => {
            const nextVars = applyOptionalManualVar(normalizeVars(vars));
            const nextNode = activeScript.nodes[node.next];
            if (nextNode && Array.isArray(nextNode.unlock_vars)) {
              nextNode.unlock_vars.forEach(k => { if (nextVars[k]) nextVars[k].visible = true; });
            }
            const newLogs = [...logs, ...nodeToLogEntries(nextNode)];
            const { data } = await db.from('game_state').update({
              current_node_id: node.next,
              variables: nextVars,
              story_log: newLogs,
              updated_at: new Date().toISOString()
            }).eq('id', 1).select().single();
            if (data) { gameState = data; renderAll(); }
          };
          choicesEl.appendChild(contBtn);
        } else if (hasChoices) {
          hasRenderedControls = true;
          const myChoices = node.choices.filter(c => !c.actor || c.actor === 'both' || c.actor === myRole);
          if (!myChoices.length) {
            choicesEl.innerHTML = `<div class="wait-tip">等待对方回应...</div>`;
          } else {
            myChoices.forEach(choice => {
              const btn = document.createElement('button');
              btn.className = 'btn-choice';
              btn.textContent = choice.label;
              btn.onclick = async () => {
                let nextVars = normalizeVars(vars);
                if (choice.effects) {
                  Object.entries(choice.effects).forEach(([k, d]) => {
                    if (!nextVars[k]) nextVars[k] = { val: 0, max: 100, owner: 'both', visible: true };
                    nextVars[k].val = Math.max(0, Math.min(nextVars[k].max, nextVars[k].val + Number(d)));
                  });
                }
                nextVars = applyOptionalManualVar(nextVars);

                const nextNode = activeScript.nodes[choice.next];
                if (nextNode && Array.isArray(nextNode.unlock_vars)) {
                  nextNode.unlock_vars.forEach(k => { if (nextVars[k]) nextVars[k].visible = true; });
                }

                const newLogs = [...logs, { type: 'player', actor: myName, role: myRole, text: choice.label }, ...nodeToLogEntries(nextNode)];

                const payload = {
                  current_node_id: choice.next,
                  variables: nextVars,
                  story_log: newLogs,
                  updated_at: new Date().toISOString()
                };
                if (isRemoteSession) payload.remote_alert = { text: choice.label, sender: myName };
                const { data } = await db.from('game_state').update(payload).eq('id', 1).select().single();
                if (data) { gameState = data; renderAll(); }
              };
              choicesEl.appendChild(btn);
            });
          }
        }
      }

      choicesWrapper.classList.toggle('hidden', !hasRenderedControls);
    }

    window.sendCustomMessage = async function() {
      const inp = document.getElementById('custom-msg-input');
      const txt = inp.value.trim();
      if (!txt || !gameState) return;
      inp.value = '';

      let nextVars = normalizeVars(gameState.variables);
      const manualValInp = document.getElementById('silent-var-val');
      if (manualValInp && manualValInp.value.trim() !== '') {
        nextVars = applyOptionalManualVar(nextVars);
      } else {
        Object.values(nextVars).forEach(v => {
          if (v.owner === 'both') v.val = Math.min(v.max, v.val + 8);
        });
      }

      let nextNodeId = gameState.current_node_id;
      const newLogs = [...(gameState.story_log || []), { type: 'player', actor: myName, role: myRole, text: txt }];

      const activeScript = allScripts.find(s => s.id === gameState.active_script_id);
      const currentNode = (activeScript && activeScript.nodes) ? activeScript.nodes[gameState.current_node_id] : null;
      if (currentNode && Array.isArray(currentNode.triggers)) {
        for (const trig of currentNode.triggers) {
          const condList = Array.isArray(trig.conditions) ? trig.conditions : (trig.condition ? [trig.condition] : []);
          if (evaluateConditions(condList, nextVars) && trig.next && activeScript.nodes[trig.next]) {
            nextNodeId = trig.next;
            const targetNode = activeScript.nodes[trig.next];
            if (Array.isArray(targetNode.unlock_vars)) {
              targetNode.unlock_vars.forEach(k => { if (nextVars[k]) nextVars[k].visible = true; });
            }
            if (trig.transition_text) {
              newLogs.push({ type: 'sys', text: trig.transition_text });
            }
            newLogs.push(...nodeToLogEntries(targetNode));
            break;
          }
        }
      }

      const payload = {
        current_node_id: nextNodeId,
        story_log: newLogs,
        variables: nextVars,
        updated_at: new Date().toISOString()
      };
      if (isRemoteSession) payload.remote_alert = { text: txt, sender: myName };
      const { data } = await db.from('game_state').update(payload).eq('id', 1).select().single();
      if (data) { gameState = data; renderAll(); }
    };

    // ==================== 侧边栏工具 ====================
    let timerId = null;
    window.startTimer = function(sec) {
      clearInterval(timerId);
      const disp = document.getElementById('timer-display');
      if (sec <= 0) { disp.textContent = '00:00'; return; }
      let rem = sec;
      const tick = () => {
        disp.textContent = `${String(Math.floor(rem / 60)).padStart(2, '0')}:${String(rem % 60).padStart(2, '0')}`;
        if (rem <= 0) clearInterval(timerId);
        rem--;
      };
      tick();
      timerId = setInterval(tick, 1000);
    };

    let audioCtx = null, beatId = null, beatOn = false, currentBpm = 60;
    function thump() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(110, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.14);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
      } catch (e) {}
    }
    function runBeat() {
      clearInterval(beatId);
      if (!beatOn) return;
      const dot = document.getElementById('beat-dot');
      beatId = setInterval(() => {
        dot.classList.add('pulse'); thump();
        setTimeout(() => dot.classList.remove('pulse'), 90);
      }, Math.round(60000 / currentBpm));
    }
    window.changeBpm = function(v) { currentBpm = Number(v); document.getElementById('bpm-val').textContent = v; if (beatOn) runBeat(); };
    window.toggleBeat = function() {
      beatOn = !beatOn;
      document.getElementById('btn-beat').textContent = beatOn ? '停止' : '启动';
      if (beatOn) runBeat(); else clearInterval(beatId);
    };

    window.drawBodyActionCombo = async function() {
      if (!gameState) return;
      const part = BODY_PARTS[Math.floor(Math.random() * BODY_PARTS.length)];
      const act = ACTIONS[Math.floor(Math.random() * ACTIONS.length)];
      const txt = `【氛围指令】对【${part}】执行：${act}`;
      const newLogs = [...(gameState.story_log || []), { type: 'sys', text: txt }];
      const payload = { story_log: newLogs, updated_at: new Date().toISOString() };
      if (isRemoteSession) payload.remote_alert = { text: txt, sender: myName };
      const { data } = await db.from('game_state').update(payload).eq('id', 1).select().single();
      if (data) { gameState = data; renderAll(); }
      document.getElementById('side-drawer').classList.remove('open');
    };

    window.drawRandomPenalty = async function() {
      if (!gameState) return;
      const item = PENALTIES[Math.floor(Math.random() * PENALTIES.length)];
      const newLogs = [...(gameState.story_log || []), { type: 'sys', text: item }];
      const payload = { story_log: newLogs, updated_at: new Date().toISOString() };
      if (isRemoteSession) payload.remote_alert = { text: item, sender: myName };
      const { data } = await db.from('game_state').update(payload).eq('id', 1).select().single();
      if (data) { gameState = data; renderAll(); }
      document.getElementById('side-drawer').classList.remove('open');
    };

    window.sendCustomCmd = async function() {
      const inp = document.getElementById('custom-cmd-input');
      const txt = inp.value.trim();
      if (!txt || !gameState) return;
      inp.value = '';
      const newLogs = [...(gameState.story_log || []), { type: 'sys', text: `【指令】${txt}` }];
      const payload = { story_log: newLogs, updated_at: new Date().toISOString() };
      if (isRemoteSession) payload.remote_alert = { text: txt, sender: myName };
      const { data } = await db.from('game_state').update(payload).eq('id', 1).select().single();
      if (data) { gameState = data; renderAll(); }
      document.getElementById('side-drawer').classList.remove('open');
    };

    window.triggerSafeWord = async function() {
      if (!gameState) return;
      const txt = '🛑 【红灯暂停】节奏暂缓，先拥抱彼此平复呼吸。';
      const newLogs = [...(gameState.story_log || []), { type: 'sys', text: txt }];
      const payload = { story_log: newLogs, updated_at: new Date().toISOString() };
      if (isRemoteSession) payload.remote_alert = { text: txt, sender: myName };
      const { data } = await db.from('game_state').update(payload).eq('id', 1).select().single();
      if (data) { gameState = data; renderAll(); }
      document.getElementById('side-drawer').classList.remove('open');
    };

    window.finishSession = async function(shouldSave) {
      hasExplicitlyFinished = true;
      clearInterval(beatId);
      clearInterval(syncPollTimer);
      if (shouldSave && gameState && gameState.active_script_id) {
        const title = document.getElementById('archive-title-input').value.trim() || new Date().toLocaleString();
        const snapshot = {
          script_id: gameState.active_script_id,
          node_id: gameState.current_node_id,
          variables: gameState.variables,
          story_log: gameState.story_log
        };
        await db.from('session_archives').insert([{ title, logs: snapshot }]);
      }
      await db.from('game_state').update({
        active_script_id: null, story_log: [], variables: {}, current_node_id: 'start', remote_alert: { text: '', sender: '' }, updated_at: new Date().toISOString()
      }).eq('id', 1);
      await db.auth.signOut();
      location.reload();
    };
  </script>
</body>
</html>
