<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow" />
  <title>YC & LY 的专属冒险</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #2c3e50;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      border-radius: 20px;
      padding: 32px 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    h1 { font-size: 22px; margin-bottom: 8px; color: #1a202c; }
    .subtitle { font-size: 14px; color: #718096; margin-bottom: 24px; }
    .form-group { margin-bottom: 16px; text-align: left; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #4a5568; }
    select, input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
      background: #f8fafc;
    }
    select:focus, input:focus { border-color: #6366f1; background: #fff; }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:active { transform: scale(0.98); }
    .btn-primary { background: #6366f1; color: white; margin-top: 8px; }
    .btn-pink { background: #ec4899; color: white; margin-bottom: 12px; }
    .btn-indigo { background: #4f46e5; color: white; margin-bottom: 12px; }
    .btn-outline { background: transparent; border: 1.5px solid #cbd5e1; color: #64748b; margin-top: 12px; padding: 10px; font-size: 14px; }
    .hidden { display: none !important; }
    .status-box {
      background: #f1f5f9;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .stats-row { display: flex; justify-content: space-around; margin: 16px 0; }
    .stat-item { text-align: center; }
    .stat-num { font-size: 32px; font-weight: 800; color: #ec4899; }
    .stat-num.dice { color: #4f46e5; }
    .stat-label { font-size: 12px; color: #64748b; margin-top: 4px; }
    .log-text { font-size: 14px; color: #334155; font-weight: 500; }
    .error-msg { color: #e11d48; font-size: 13px; margin-top: 10px; }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      background: #dcfce7;
      color: #15803d;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <!-- 登录界面 -->
  <div id="login-view" class="card">
    <div class="form-group">
      <label for="player-select">选择你的角色</label>
      <select id="player-select">
        <option value="yc@play.game">YC</option>
        <option value="ly@play.game">LY</option>
      </select>
    </div>
    <div class="form-group">
      <label for="password-input">通行密码</label>
      <input type="password" id="password-input" placeholder="输入专属密码" />
    </div>
    <button id="login-btn" class="btn-primary">解锁进入</button>
    <p id="login-error" class="error-msg"></p>
  </div>

  <!-- 游戏大厅界面 -->
  <div id="game-view" class="card hidden">
    <span class="badge" id="welcome-badge">已连接云端同步</span>
    <h1>双人实时同步测试大厅</h1>
    <p class="subtitle">任一方点击按钮，另一方手机屏幕秒级刷新</p>

    <div class="status-box">
      <div class="log-text" id="status-text">正在加载状态...</div>
      <div class="stats-row">
        <div class="stat-item">
          <div class="stat-num" id="heart-count">-</div>
          <div class="stat-label">心动值</div>
        </div>
        <div class="stat-item">
          <div class="stat-num dice" id="dice-num">-</div>
          <div class="stat-label">最新骰子 (D20)</div>
        </div>
      </div>
    </div>

    <button id="btn-heart" class="btn-pink">发送一颗心动 (+1)</button>
    <button id="btn-dice" class="btn-indigo">投掷 20 面命运骰 (D20)</button>
    <button id="logout-btn" class="btn-outline">退出登录</button>
  </div>

  <script>
    // ==========================================
    // 只需把下面的 ANON_KEY 替换成你的即可！
    // ==========================================
    const SUPABASE_URL = 'https://hciqpdghykrdctxbpwpc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_gbR5IGXPz5n1kVTEpbq7pQ_R3dPPdud';

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginView = document.getElementById('login-view');
    const gameView = document.getElementById('game-view');
    const loginError = document.getElementById('login-error');
    const welcomeBadge = document.getElementById('welcome-badge');
    const statusText = document.getElementById('status-text');
    const heartCountEl = document.getElementById('heart-count');
    const diceNumEl = document.getElementById('dice-num');

    let currentState = { heart_count: 0, last_dice: 6 };
    let currentPlayerName = '';

    // 渲染最新游戏画面
    function renderState(state) {
      if (!state) return;
      currentState = state;
      heartCountEl.textContent = state.heart_count;
      diceNumEl.textContent = state.last_dice;
      statusText.textContent = `【${state.last_actor}】${state.status_text}`;
    }

    // 拉取当前状态并订阅实时变化
    async function initGameSync(userEmail) {
      currentPlayerName = userEmail.startsWith('yc') ? 'YC' : 'LY';
      welcomeBadge.textContent = `在线玩家：${currentPlayerName}（实时同步中）`;

      const { data, error } = await db.from('game_state').select('*').eq('id', 1).single();
      if (data) renderState(data);

      // 监听数据库实时推送
      db.channel('room-1')
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'game_state', filter: 'id=eq.1' }, (payload) => {
          renderState(payload.new);
        })
        .subscribe();
    }

    // 检查是否已登录
    db.auth.getSession().then(({ data: { session } }) => {
      if (session) {
        loginView.classList.add('hidden');
        gameView.classList.remove('hidden');
        initGameSync(session.user.email);
      }
    });

    // 登录按钮事件
    document.getElementById('login-btn').addEventListener('click', async () => {
      loginError.textContent = '';
      const email = document.getElementById('player-select').value;
      const password = document.getElementById('password-input').value;
      if (!password) {
        loginError.textContent = '请输入密码';
        return;
      }

      const { data, error } = await db.auth.signInWithPassword({ email, password });
      if (error) {
        loginError.textContent = '密码错误或账号未确认，请检查输入';
      } else {
        loginView.classList.add('hidden');
        gameView.classList.remove('hidden');
        initGameSync(data.user.email);
      }
    });

    // 互动按钮 1：增加心动值
    document.getElementById('btn-heart').addEventListener('click', async () => {
      const nextHeart = (currentState.heart_count || 0) + 1;
      await db.from('game_state').update({
        heart_count: nextHeart,
        last_actor: currentPlayerName,
        status_text: `发送了一颗心动！当前累计 ${nextHeart} 颗`,
        updated_at: new Date().toISOString()
      }).eq('id', 1);
    });

    // 互动按钮 2：投掷 D20 骰子
    document.getElementById('btn-dice').addEventListener('click', async () => {
      const roll = Math.floor(Math.random() * 20) + 1;
      const comment = roll === 20 ? '大成功！！运气爆棚！' : (roll === 1 ? '大失败...快抱抱安慰一下' : `掷出了 ${roll} 点`);
      await db.from('game_state').update({
        last_dice: roll,
        last_actor: currentPlayerName,
        status_text: comment,
        updated_at: new Date().toISOString()
      }).eq('id', 1);
    });

    // 退出登录
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await db.auth.signOut();
      location.reload();
    });
  </script>
</body>
</html>
