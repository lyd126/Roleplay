<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Session</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0a0a0e; color: #e4e4e7; min-height: 100vh;
      display: flex; justify-content: center; padding: 14px;
    }

    .app-shell { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 12px; }
    .main-layout { display: flex; flex-direction: column; gap: 12px; }

    @media (min-width: 820px) {
      body { padding: 24px; }
      .app-shell { max-width: 1080px; }
      .main-layout {
        display: grid;
        grid-template-columns: 1.45fr 1fr;
        align-items: start;
        gap: 18px;
      }
      .story-feed { max-height: 62vh !important; }
    }

    .card { background: #15151c; border: 1px solid #262634; border-radius: 14px; padding: 16px; }
    .hidden { display: none !important; }

    select, input, textarea {
      width: 100%; padding: 10px 12px; border: 1px solid #2e2e3e; border-radius: 9px;
      background: #0e0e13; color: #f4f4f5; font-size: 14px; outline: none;
    }
    select:focus, input:focus, textarea:focus { border-color: #db2777; }

    button {
      padding: 10px 13px; border: none; border-radius: 9px; font-size: 13.5px; font-weight: 600;
      cursor: pointer; transition: transform 0.1s, opacity 0.15s;
    }
    button:active { transform: scale(0.97); }
    .btn-accent { background: linear-gradient(135deg, #9333ea, #db2777); color: #fff; }
    .btn-ghost { background: #1e1e28; border: 1px solid #2e2e3e; color: #cbd5e1; }
    .btn-danger { background: rgba(225, 29, 72, 0.15); border: 1px solid #be123c; color: #fda4af; }

    /* 顶部栏 */
    .top-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .presence { display: flex; gap: 6px; align-items: center; }
    .pill {
      display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px;
      border-radius: 99px; font-size: 12px; background: #1c1c24; color: #71717a;
    }
    .pill.on { background: rgba(219, 39, 119, 0.18); color: #f472b6; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #52525b; }
    .pill.on .dot { background: #ec4899; box-shadow: 0 0 6px #ec4899; }

    .remote-chip {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
      border-radius: 99px; font-size: 12px; background: #1c1c24; border: 1px solid #2e2e3e; cursor: pointer;
    }
    .remote-chip.active { border-color: #db2777; color: #f472b6; background: rgba(219, 39, 119, 0.12); }

    .remote-banner {
      background: linear-gradient(135deg, rgba(147, 51, 234, 0.25), rgba(219, 39, 119, 0.25));
      border: 1px solid #ec4899; border-radius: 12px; padding: 12px 14px;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }

    /* 可交互状态滑块仪表盘 */
    .stats-panel { display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; }
    .stat-row {
      background: #1a1a23; border: 1px solid #2a2a38; border-radius: 10px; padding: 9px 12px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .stat-header { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; }
    .stat-owner-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; margin-right: 6px; font-weight: 700; }
    .owner-both { background: #2e1f3d; color: #d8b4fe; }
    .owner-female { background: #3d1c2e; color: #f472b6; }
    .owner-male { background: #1e293b; color: #818cf8; }
    .stat-slider-wrap { display: flex; align-items: center; gap: 10px; }
    .stat-slider-wrap input[type="range"] { flex: 1; padding: 0; accent-color: #ec4899; cursor: pointer; }
    .stat-slider-wrap.male-slider input[type="range"] { accent-color: #6366f1; }

    /* 剧情流 */
    .story-feed { display: flex; flex-direction: column; gap: 10px; max-height: 44vh; overflow-y: auto; padding-right: 4px; }
    .msg-narrator { background: #211a2b; border-left: 3px solid #db2777; padding: 12px; border-radius: 9px; font-size: 14px; line-height: 1.65; }
    .msg-player { background: #1c1c25; padding: 9px 12px; border-radius: 9px; font-size: 13.5px; }
    .msg-player .tag-f { color: #f472b6; font-weight: 700; margin-right: 6px; }
    .msg-player .tag-m { color: #818cf8; font-weight: 700; margin-right: 6px; }
    .msg-sys { text-align: center; font-size: 12px; color: #c084fc; padding: 2px 0; }

    /* 选项区 */
    .choices-box { display: flex; flex-direction: column; gap: 8px; }
    .btn-choice { width: 100%; background: #22222e; border: 1px solid #38384c; color: #f4f4f5; text-align: left; padding: 12px 14px; line-height: 1.45; }
    .btn-choice:hover:not(:disabled) { border-color: #db2777; background: #2b2236; }
    .btn-choice:disabled { opacity: 0.42; cursor: not-allowed; border-style: dashed; }
    .wait-tip { text-align: center; padding: 14px; background: #1b1b24; border-radius: 9px; font-size: 13px; color: #71717a; border: 1px dashed #2e2e3e; }

    /* 嵌入式工具 */
    .mini-tools { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #262634; padding-top: 12px; margin-top: 4px; }
    .tool-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
    .beat-dot { width: 14px; height: 14px; border-radius: 50%; background: #52525b; display: inline-block; transition: transform 0.08s; }
    .beat-dot.pulse { background: #ec4899; transform: scale(1.4); box-shadow: 0 0 10px #ec4899; }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.82);
      display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100;
    }
  </style>
</head>
<body>

  <!-- 登录 -->
  <div id="login-view" class="app-shell" style="max-width: 380px; justify-content: center;">
    <div class="card" style="display: flex; flex-direction: column; gap: 12px;">
      <select id="player-select">
        <option value="yc@play.game">YC</option>
        <option value="ly@play.game">LY</option>
      </select>
      <input type="password" id="password-input" placeholder="Password" />
      <button id="login-btn" class="btn-accent">Enter</button>
      <p id="login-error" style="color:#fb7185; font-size:13px; text-align:center;"></p>
    </div>
  </div>

  <!-- 主界面 -->
  <div id="app-view" class="app-shell hidden">
    <div class="top-bar">
      <div class="presence">
        <div id="pill-yc" class="pill"><span class="dot"></span>YC</div>
        <div id="pill-ly" class="pill"><span class="dot"></span>LY</div>
        <div id="remote-chip" class="remote-chip" onclick="toggleRemoteMode()">异地：关</div>
      </div>
      <div style="display: flex; gap: 6px;">
        <button class="btn-ghost" onclick="togglePanel('upload-panel')">+ 剧本</button>
        <button class="btn-ghost" onclick="toggleArchivesPanel()">存档</button>
        <button class="btn-danger" onclick="document.getElementById('exit-modal').classList.remove('hidden')">退出</button>
      </div>
    </div>

    <div id="remote-banner" class="remote-banner hidden">
      <div id="remote-banner-text" style="font-size: 13.5px; color: #fff; line-height: 1.4;"></div>
      <button class="btn-accent" style="padding: 6px 12px; font-size: 12px; white-space: nowrap;" onclick="ackRemoteAlert()">收到</button>
    </div>

    <!-- 上传剧本 -->
    <div id="upload-panel" class="card hidden" style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; gap: 8px;">
        <input type="text" id="new-script-title" placeholder="剧本名称" style="flex: 2;" />
        <select id="new-script-type" style="flex: 1;">
          <option value="conquest">攻略</option>
          <option value="edging">寸止</option>
          <option value="domsub">支配</option>
          <option value="story">剧情</option>
        </select>
      </div>
      <input type="text" id="new-script-summary" placeholder="简介" />
      <textarea id="new-script-json" rows="4" placeholder="JSON 内容"></textarea>
      <button class="btn-accent" onclick="saveNewScript()">保存至云端</button>
    </div>

    <!-- 历史存档 -->
    <div id="archives-panel" class="card hidden" style="display: flex; flex-direction: column; gap: 8px;">
      <div id="archives-list" style="font-size: 13px; color: #a1a1aa;"></div>
    </div>

    <!-- 双栏/单栏自适应 -->
    <div class="main-layout">
      <!-- 左栏：选本 + 可交互状态滑块 + 剧情流 -->
      <div class="card" style="display: flex; flex-direction: column; gap: 10px;">
        <div style="display: flex; gap: 6px;">
          <select id="script-selector" style="flex: 1;"></select>
          <button class="btn-accent" onclick="startSelectedScript()">开始</button>
          <button class="btn-ghost" onclick="startRandomScript()">🎲</button>
          <button class="btn-danger" onclick="deleteSelectedScript()">删</button>
        </div>

        <!-- 动态可交互状态滑块区 -->
        <div id="stats-panel" class="stats-panel hidden"></div>

        <div>
          <div id="active-script-title" style="font-size: 15px; font-weight: 700; color: #f472b6;"></div>
          <div id="active-script-summary" style="font-size: 12px; color: #71717a; margin-top: 2px;"></div>
        </div>

        <div class="story-feed" id="story-feed"></div>
      </div>

      <!-- 右栏：分支抉择 + 自由台词 + 精简工具 -->
      <div class="card" style="display: flex; flex-direction: column; gap: 12px;">
        <div class="choices-box" id="choices-box"></div>

        <div style="display: flex; gap: 8px;">
          <input type="text" id="custom-msg-input" placeholder="输入台词或动作..." onkeypress="if(event.key==='Enter') sendCustomMessage()" />
          <button class="btn-accent" onclick="sendCustomMessage()">发送</button>
        </div>

        <div class="mini-tools">
          <div class="tool-row">
            <span style="font-size: 12px; color: #a1a1aa;">计时 <strong id="timer-display" style="color:#f472b6; margin-left:4px;">00:00</strong></span>
            <div style="display: flex; gap: 4px;">
              <button class="btn-ghost" style="padding:5px 8px; font-size:12px;" onclick="startTimer(30)">30s</button>
              <button class="btn-ghost" style="padding:5px 8px; font-size:12px;" onclick="startTimer(60)">60s</button>
              <button class="btn-ghost" style="padding:5px 8px; font-size:12px;" onclick="startTimer(180)">3m</button>
              <button class="btn-ghost" style="padding:5px 8px; font-size:12px;" onclick="startTimer(0)">停</button>
            </div>
          </div>

          <div class="tool-row">
            <div style="display:flex; align-items:center; gap:6px;">
              <span id="beat-dot" class="beat-dot"></span>
              <span style="font-size: 12px; color: #a1a1aa;"><span id="bpm-val">60</span> BPM</span>
            </div>
            <input type="range" id="bpm-slider" min="30" max="160" value="60" style="width: 110px; padding:0;" oninput="changeBpm(this.value)" />
            <button id="btn-beat" class="btn-ghost" style="padding:5px 10px; font-size:12px;" onclick="toggleBeat()">节拍开</button>
          </div>

          <div class="tool-row">
            <button class="btn-ghost" style="flex:1; font-size:12px;" onclick="drawRandomPenalty()">⚡ 抽取临时惩罚 / 指令</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 退出弹窗 -->
  <div id="exit-modal" class="modal-backdrop hidden">
    <div class="card" style="max-width: 360px; width: 100%; display: flex; flex-direction: column; gap: 10px;">
      <input type="text" id="archive-title-input" placeholder="存档名称（若保存）" />
      <button class="btn-accent" onclick="finishSession(true)">保存记录并退出</button>
      <button class="btn-danger" onclick="finishSession(false)">彻底删除记录并退出</button>
      <button class="btn-ghost" onclick="document.getElementById('exit-modal').classList.add('hidden')">取消</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://hciqpdghykrdctxbpwpc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_gbR5IGXPz5n1kVTEpbq7pQ_R3dPPdud';

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { storage: window.sessionStorage, autoRefreshToken: true, persistSession: true }
    });

    let myRole = '', myName = '', allScripts = [], gameState = null;

    const PENALTIES = [
      '【指令】保持当前姿势静止 60 秒，不准发出声音。',
      '【指令】蒙上眼睛，接下来 2 分钟完全交由对方主导。',
      '【惩罚】拍打臀部 10 下并大声报数。',
      '【惩罚】用唇舌服侍对方 2 分钟，不准用手。',
      '【惩罚】坦白此刻最羞耻的一个想法。',
      '【指令】暂停所有动作深呼吸 30 秒，忍住不许越线。'
    ];

    db.auth.getSession().then(({ data: { session } }) => { if (session) initSession(session); });

    document.getElementById('login-btn').addEventListener('click', async () => {
      const email = document.getElementById('player-select').value;
      const password = document.getElementById('password-input').value;
      const { data, error } = await db.auth.signInWithPassword({ email, password });
      if (error) document.getElementById('login-error').textContent = error.message;
      else initSession(data.session);
    });

    async function initSession(session) {
      const email = session.user.email;
      myName = email.startsWith('yc') ? 'YC' : 'LY';
      myRole = email.startsWith('yc') ? 'female' : 'male';

      document.getElementById('login-view').classList.add('hidden');
      document.getElementById('app-view').classList.remove('hidden');

      await loadScripts();
      const { data } = await db.from('game_state').select('*').eq('id', 1).single();
      gameState = data;
      renderAll();

      const channel = db.channel('room-1', { config: { presence: { key: myName } } });
      channel
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'game_state', filter: 'id=eq.1' }, async (payload) => {
          gameState = payload.new;
          if (gameState.active_script_id && !allScripts.find(s => s.id === gameState.active_script_id)) await loadScripts();
          renderAll();
        })
        .on('presence', { event: 'sync' }, () => {
          const online = new Set();
          Object.values(channel.presenceState()).forEach(arr => arr.forEach(s => s.player && online.add(s.player)));
          ['YC', 'LY'].forEach(n => document.getElementById(`pill-${n.toLowerCase()}`).classList.toggle('on', online.has(n)));
        })
        .subscribe(async status => { if (status === 'SUBSCRIBED') await channel.track({ player: myName }); });
    }

    window.togglePanel = function(id) { document.getElementById(id).classList.toggle('hidden'); };

    window.toggleRemoteMode = async function() {
      if (!gameState) return;
      await db.from('game_state').update({ is_remote: !gameState.is_remote }).eq('id', 1);
    };

    window.ackRemoteAlert = async function() {
      await db.from('game_state').update({ remote_alert: { text: '', sender: '' } }).eq('id', 1);
    };

    async function loadScripts() {
      const { data } = await db.from('scripts').select('*').order('created_at', { ascending: false });
      allScripts = data || [];
      const sel = document.getElementById('script-selector');
      sel.innerHTML = allScripts.length
        ? allScripts.map(s => `<option value="${s.id}">【${s.type}】${s.title}</option>`).join('')
        : '<option value="">暂无剧本</option>';
      if (gameState && gameState.active_script_id) sel.value = gameState.active_script_id;
    }

    // 兼容两种 initial_vars 格式：
    // 1. 简写数字: { "心动值": 20 } -> 自动归一化为 { val: 20, max: 100, owner: 'both' }
    // 2. 完整对象: { "射精临界值": { "val": 10, "max": 100, "owner": "male" } }
    function normalizeVars(rawVars) {
      const res = {};
      if (!rawVars) return res;
      Object.entries(rawVars).forEach(([k, v]) => {
        if (typeof v === 'object' && v !== null) {
          res[k] = { val: Number(v.val ?? 0), max: Number(v.max ?? 100), owner: v.owner || 'both' };
        } else {
          res[k] = { val: Number(v ?? 0), max: 100, owner: 'both' };
        }
      });
      return res;
    }

    window.startSelectedScript = async function() {
      const id = document.getElementById('script-selector').value;
      const picked = allScripts.find(s => s.id === id);
      if (!picked) return;
      const startNode = picked.nodes['start'];
      await db.from('game_state').update({
        active_script_id: picked.id,
        current_node_id: 'start',
        variables: normalizeVars(picked.initial_vars),
        story_log: startNode ? [{ type: 'narrator', text: startNode.text }] : [],
        remote_alert: { text: '', sender: '' }
      }).eq('id', 1);
    };

    window.startRandomScript = async function() {
      if (!allScripts.length) return;
      const picked = allScripts[Math.floor(Math.random() * allScripts.length)];
      document.getElementById('script-selector').value = picked.id;
      await startSelectedScript();
    };

    window.saveNewScript = async function() {
      const title = document.getElementById('new-script-title').value.trim();
      const type = document.getElementById('new-script-type').value;
      const summary = document.getElementById('new-script-summary').value.trim();
      const rawJson = document.getElementById('new-script-json').value.trim();
      if (!title || !rawJson) return;
      try {
        const parsed = JSON.parse(rawJson);
        const nodes = parsed.nodes ? parsed.nodes : parsed;
        const initialVars = parsed.initial_vars || {};
        if (!nodes.start) return alert('缺少 start 节点');
        const { error } = await db.from('scripts').insert([{ title, type, summary, initial_vars: initialVars, nodes }]);
        if (error) throw error;
        document.getElementById('new-script-title').value = '';
        document.getElementById('new-script-summary').value = '';
        document.getElementById('new-script-json').value = '';
        document.getElementById('upload-panel').classList.add('hidden');
        await loadScripts();
      } catch (e) { alert(e.message); }
    };

    window.deleteSelectedScript = async function() {
      const id = document.getElementById('script-selector').value;
      if (!id || !confirm('确认删除？')) return;
      await db.from('scripts').delete().eq('id', id);
      await loadScripts();
    };

    // 手动拖动滑块同步状态数值
    window.onSliderInput = function(key, val) {
      const labelEl = document.getElementById(`stat-val-${key}`);
      if (labelEl) labelEl.textContent = val;
    };
    window.onSliderCommit = async function(key, val) {
      if (!gameState || !gameState.variables) return;
      const nextVars = JSON.parse(JSON.stringify(gameState.variables));
      if (nextVars[key]) {
        nextVars[key].val = Number(val);
        await db.from('game_state').update({ variables: nextVars }).eq('id', 1);
      }
    };

    function renderAll() {
      if (!gameState) return;

      const isRemote = Boolean(gameState.is_remote);
      const chip = document.getElementById('remote-chip');
      chip.textContent = isRemote ? '异地：开' : '异地：关';
      chip.classList.toggle('active', isRemote);

      const alertObj = gameState.remote_alert || {};
      const banner = document.getElementById('remote-banner');
      if (isRemote && alertObj.text && alertObj.sender !== myName) {
        banner.classList.remove('hidden');
        document.getElementById('remote-banner-text').textContent = `[${alertObj.sender}] ${alertObj.text}`;
      } else {
        banner.classList.add('hidden');
      }

      const activeScript = allScripts.find(s => s.id === gameState.active_script_id);
      const titleEl = document.getElementById('active-script-title');
      const subEl = document.getElementById('active-script-summary');
      const statsPanel = document.getElementById('stats-panel');
      const feedEl = document.getElementById('story-feed');
      const choicesEl = document.getElementById('choices-box');

      if (!activeScript) {
        titleEl.textContent = '未选择剧本';
        subEl.textContent = '';
        statsPanel.classList.add('hidden');
        feedEl.innerHTML = '';
        choicesEl.innerHTML = '';
        return;
      }

      titleEl.textContent = activeScript.title;
      subEl.textContent = activeScript.summary || '';

      // 渲染可拖动状态滑块栏（支持共有 / 女方专属 / 男方专属）
      const vars = normalizeVars(gameState.variables);
      const varEntries = Object.entries(vars);
      if (!varEntries.length) {
        statsPanel.classList.add('hidden');
      } else {
        statsPanel.classList.remove('hidden');
        statsPanel.innerHTML = varEntries.map(([k, item]) => {
          const ownerTag = item.owner === 'female'
            ? `<span class="stat-owner-tag owner-female">女方</span>`
            : (item.owner === 'male'
              ? `<span class="stat-owner-tag owner-male">男方</span>`
              : `<span class="stat-owner-tag owner-both">双方</span>`);
          const canDrag = item.owner === 'both' || item.owner === myRole;
          const sliderClass = item.owner === 'male' ? 'stat-slider-wrap male-slider' : 'stat-slider-wrap';
          return `
            <div class="stat-row">
              <div class="stat-header">
                <div>${ownerTag}<strong>${k}</strong></div>
                <div><strong id="stat-val-${k}" style="color:#f472b6;">${item.val}</strong> <span style="color:#71717a;">/ ${item.max}</span></div>
              </div>
              <div class="${sliderClass}">
                <input type="range" min="0" max="${item.max}" value="${item.val}" ${canDrag ? '' : 'disabled'}
                  oninput="onSliderInput('${k}', this.value)"
                  onchange="onSliderCommit('${k}', this.value)" />
              </div>
            </div>
          `;
        }).join('');
      }

      // 剧情流
      const logs = Array.isArray(gameState.story_log) ? gameState.story_log : [];
      feedEl.innerHTML = logs.map(item => {
        if (item.type === 'narrator') return `<div class="msg-narrator">${item.text}</div>`;
        if (item.type === 'sys') return `<div class="msg-sys">${item.text}</div>`;
        const cls = item.role === 'female' ? 'tag-f' : 'tag-m';
        return `<div class="msg-player"><span class="${cls}">[${item.actor}]</span>${item.text}</div>`;
      }).join('');
      feedEl.scrollTop = feedEl.scrollHeight;

      // 分支选项与阈值判断
      const node = activeScript.nodes[gameState.current_node_id];
      choicesEl.innerHTML = '';
      if (node && Array.isArray(node.choices) && node.choices.length > 0) {
        const myChoices = node.choices.filter(c => !c.actor || c.actor === 'both' || c.actor === myRole);
        if (!myChoices.length) {
          choicesEl.innerHTML = `<div class="wait-tip">等待对方行动...</div>`;
        } else {
          myChoices.forEach(choice => {
            let passed = true, hint = '';
            // 支持单个 condition 对象或 conditions 数组
            const condList = Array.isArray(choice.conditions)
              ? choice.conditions
              : (choice.condition ? [choice.condition] : []);

            if (condList.length > 0) {
              const hints = [];
              condList.forEach(cond => {
                const cur = Number((vars[cond.var] || {}).val ?? 0);
                const tgt = Number(cond.val);
                let ok = false;
                if (cond.op === '>=') ok = cur >= tgt;
                else if (cond.op === '<=') ok = cur <= tgt;
                else if (cond.op === '>') ok = cur > tgt;
                else if (cond.op === '<') ok = cur < tgt;
                else if (cond.op === '==') ok = cur == tgt;
                if (!ok) passed = false;
                hints.push(`${cond.var}${cond.op}${tgt}`);
              });
              hint = ` [${hints.join(' 且 ')}]`;
            }

            const btn = document.createElement('button');
            btn.className = 'btn-choice';
            btn.disabled = !passed;
            btn.textContent = (passed ? '' : '🔒 ') + choice.label + hint;
            btn.onclick = async () => {
              const nextVars = JSON.parse(JSON.stringify(vars));
              const effTxt = [];
              if (choice.effects) {
                Object.entries(choice.effects).forEach(([k, d]) => {
                  if (!nextVars[k]) nextVars[k] = { val: 0, max: 100, owner: 'both' };
                  nextVars[k].val = Math.max(0, Math.min(nextVars[k].max, nextVars[k].val + Number(d)));
                  effTxt.push(`${k}${d >= 0 ? '+' + d : d}`);
                });
              }
              const nextNode = activeScript.nodes[choice.next];
              const newLogs = [...logs, { type: 'player', actor: myName, role: myRole, text: choice.label }];
              if (effTxt.length) newLogs.push({ type: 'sys', text: effTxt.join(' · ') });
              if (nextNode) newLogs.push({ type: 'narrator', text: nextNode.text });

              const payload = { current_node_id: choice.next, variables: nextVars, story_log: newLogs };
              if (gameState.is_remote) payload.remote_alert = { text: choice.label, sender: myName };
              await db.from('game_state').update(payload).eq('id', 1);
            };
            choicesEl.appendChild(btn);
          });
        }
      }
    }

    window.sendCustomMessage = async function() {
      const inp = document.getElementById('custom-msg-input');
      const txt = inp.value.trim();
      if (!txt || !gameState) return;
      inp.value = '';
      const newLogs = [...(gameState.story_log || []), { type: 'player', actor: myName, role: myRole, text: txt }];
      const payload = { story_log: newLogs };
      if (gameState.is_remote) payload.remote_alert = { text: txt, sender: myName };
      await db.from('game_state').update(payload).eq('id', 1);
    };

    let timerId = null;
    window.startTimer = function(sec) {
      clearInterval(timerId);
      const disp = document.getElementById('timer-display');
      if (sec <= 0) { disp.textContent = '00:00'; return; }
      let rem = sec;
      const tick = () => {
        disp.textContent = `${String(Math.floor(rem / 60)).padStart(2, '0')}:${String(rem % 60).padStart(2, '0')}`;
        if (rem <= 0) clearInterval(timerId);
        rem--;
      };
      tick();
      timerId = setInterval(tick, 1000);
    };

    let audioCtx = null, beatId = null, beatOn = false, currentBpm = 60;
    function thump() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(110, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.14);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
      } catch (e) {}
    }
    function runBeat() {
      clearInterval(beatId);
      if (!beatOn) return;
      const dot = document.getElementById('beat-dot');
      beatId = setInterval(() => {
        dot.classList.add('pulse'); thump();
        setTimeout(() => dot.classList.remove('pulse'), 90);
      }, Math.round(60000 / currentBpm));
    }
    window.changeBpm = function(v) { currentBpm = Number(v); document.getElementById('bpm-val').textContent = v; if (beatOn) runBeat(); };
    window.toggleBeat = function() {
      beatOn = !beatOn;
      document.getElementById('btn-beat').textContent = beatOn ? '节拍关' : '节拍开';
      if (beatOn) runBeat(); else clearInterval(beatId);
    };

    window.drawRandomPenalty = async function() {
      if (!gameState) return;
      const item = PENALTIES[Math.floor(Math.random() * PENALTIES.length)];
      const newLogs = [...(gameState.story_log || []), { type: 'sys', text: `${myName} 抽取：${item}` }];
      const payload = { story_log: newLogs };
      if (gameState.is_remote) payload.remote_alert = { text: item, sender: myName };
      await db.from('game_state').update(payload).eq('id', 1);
    };

    window.finishSession = async function(shouldSave) {
      clearInterval(beatId);
      if (shouldSave && gameState && Array.isArray(gameState.story_log) && gameState.story_log.length > 0) {
        const title = document.getElementById('archive-title-input').value.trim() || new Date().toLocaleString();
        await db.from('session_archives').insert([{ title, logs: gameState.story_log }]);
      }
      await db.from('game_state').update({
        story_log: [], variables: {}, current_node_id: 'start', remote_alert: { text: '', sender: '' }
      }).eq('id', 1);
      await db.auth.signOut();
      location.reload();
    };

    window.toggleArchivesPanel = async function() {
      const panel = document.getElementById('archives-panel');
      panel.classList.toggle('hidden');
      if (!panel.classList.contains('hidden')) {
        const { data } = await db.from('session_archives').select('*').order('created_at', { ascending: false });
        const listEl = document.getElementById('archives-list');
        listEl.innerHTML = (!data || !data.length) ? '空' : data.map(item => `
          <div style="background:#1c1c26; padding:10px; border-radius:8px; margin-bottom:6px;">
            <div style="display:flex; justify-content:space-between; color:#f472b6; font-weight:600; margin-bottom:4px;">
              <span>${item.title}</span>
              <span style="cursor:pointer; color:#fb7185;" onclick="deleteArchive('${item.id}')">删除</span>
            </div>
            <div style="font-size:12px; color:#d4d4d8; max-height:90px; overflow-y:auto;">
              ${(item.logs || []).map(l => `<div>${l.actor ? '['+l.actor+'] ' : ''}${l.text}</div>`).join('')}
            </div>
          </div>
        `).join('');
      }
    };
    window.deleteArchive = async function(id) {
      await db.from('session_archives').delete().eq('id', id);
      toggleArchivesPanel(); toggleArchivesPanel();
    };
  </script>
</body>
</html>
