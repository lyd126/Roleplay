<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Private Session</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f0f13;
      color: #e4e4e7;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px;
    }
    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card {
      background: #18181f;
      border: 1px solid #272732;
      border-radius: 16px;
      padding: 20px;
    }
    .hidden { display: none !important; }
    select, input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #2e2e3a;
      border-radius: 10px;
      background: #111116;
      color: #f4f4f5;
      font-size: 15px;
      outline: none;
    }
    select:focus, input:focus, textarea:focus { border-color: #a855f7; }
    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    button:active { transform: scale(0.98); }
    .btn-accent { background: linear-gradient(135deg, #9333ea, #db2777); color: #fff; }
    .btn-choice {
      background: #23232e;
      border: 1px solid #38384a;
      color: #f4f4f5;
      text-align: left;
      padding: 14px 16px;
      line-height: 1.4;
    }
    .btn-choice:hover { border-color: #db2777; background: #2a2433; }
    .btn-ghost { background: transparent; border: 1px solid #2e2e3a; color: #a1a1aa; padding: 9px 12px; font-size: 13px; width: auto; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; }
    .presence { display: flex; gap: 8px; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 99px; font-size: 12px;
      background: #1e1e26; color: #71717a;
    }
    .pill.on { background: rgba(219, 39, 119, 0.15); color: #f472b6; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #52525b; }
    .pill.on .dot { background: #ec4899; box-shadow: 0 0 6px #ec4899; }

    /* 剧情流区域 */
    .story-feed {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 52vh;
      overflow-y: auto;
      padding-right: 4px;
    }
    .msg-narrator {
      background: #201c29;
      border-left: 3px solid #db2777;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      line-height: 1.65;
      color: #f4f4f5;
    }
    .msg-player {
      background: #1e1e26;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      color: #d4d4d8;
    }
    .msg-player span { color: #f472b6; font-weight: 700; margin-right: 6px; }
    .choices-box { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
    .input-row { display: flex; gap: 8px; margin-top: 10px; }
    .input-row input { flex: 1; }
    .input-row button { width: auto; padding: 0 18px; }
    .script-title { font-size: 17px; font-weight: 700; color: #f472b6; margin-bottom: 4px; }
    .script-sub { font-size: 13px; color: #a1a1aa; margin-bottom: 12px; }
    .error-msg { color: #fb7185; font-size: 13px; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>

  <!-- 登录框（已移除标题和副标题） -->
  <div id="login-view" class="container" style="justify-content: center;">
    <div class="card" style="display: flex; flex-direction: column; gap: 14px;">
      <select id="player-select">
        <option value="yc@play.game">YC</option>
        <option value="ly@play.game">LY</option>
      </select>
      <input type="password" id="password-input" placeholder="Password" />
      <button id="login-btn" class="btn-accent">Enter</button>
      <p id="login-error" class="error-msg"></p>
    </div>
  </div>

  <!-- 主互动界面 -->
  <div id="game-view" class="container hidden">
    <div class="top-bar">
      <div class="presence">
        <div id="pill-yc" class="pill"><span class="dot"></span>YC</div>
        <div id="pill-ly" class="pill"><span class="dot"></span>LY</div>
      </div>
      <div style="display: flex; gap: 6px;">
        <button id="btn-random-script" class="btn-ghost">随机切换剧本</button>
        <button id="btn-toggle-upload" class="btn-ghost">+ 上传剧本</button>
        <button id="logout-btn" class="btn-ghost">退出</button>
      </div>
    </div>

    <!-- 上传剧本面板（默认折叠） -->
    <div id="upload-panel" class="card hidden" style="display: flex; flex-direction: column; gap: 10px;">
      <div style="font-size: 14px; font-weight: 600; color: #f472b6;">添加新分支剧本 (JSON 格式)</div>
      <input type="text" id="new-script-title" placeholder="剧本名称，例如：酒店总统套房" />
      <input type="text" id="new-script-summary" placeholder="一句话设定（可选）" />
      <textarea id="new-script-json" rows="6" placeholder='粘贴节点 JSON，例如：
{
  "start": {
    "text": "开场白...",
    "choices": [
      { "label": "选项A", "next": "node2" }
    ]
  },
  "node2": { "text": "后续发展...", "choices": [] }
}'></textarea>
      <button id="btn-save-script" class="btn-accent">保存到剧本库</button>
    </div>

    <!-- 剧情主舞台 -->
    <div class="card">
      <div class="script-title" id="active-script-title">尚未抽取剧本</div>
      <div class="script-sub" id="active-script-summary">点击右上角“随机切换剧本”开始</div>

      <div class="story-feed" id="story-feed"></div>

      <!-- 分支选项按钮区 -->
      <div class="choices-box" id="choices-box"></div>

      <!-- 自由文字输入（补充台词或动作） -->
      <div class="input-row">
        <input type="text" id="custom-msg-input" placeholder="输入台词或动作描写..." />
        <button id="btn-send-msg" class="btn-accent">发送</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://hciqpdghykrdctxbpwpc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_gbR5IGXPz5n1kVTEpbq7pQ_R3dPPdud';

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        storage: window.sessionStorage,
        autoRefreshToken: true,
        persistSession: true
      }
    });

    let currentPlayer = '';
    let allScripts = [];
    let activeScript = null;
    let gameState = null;

    const loginView = document.getElementById('login-view');
    const gameView = document.getElementById('game-view');

    function updatePresenceUI(presenceState) {
      const online = new Set();
      Object.values(presenceState).forEach(arr => arr.forEach(s => s.player && online.add(s.player)));
      ['YC', 'LY'].forEach(name => {
        const el = document.getElementById(`pill-${name.toLowerCase()}`);
        if (online.has(name)) el.classList.add('on');
        else el.classList.remove('on');
      });
    }

    async function loadScripts() {
      const { data } = await db.from('scripts').select('*').order('created_at', { ascending: false });
      allScripts = data || [];
    }

    function renderGame() {
      if (!gameState) return;
      activeScript = allScripts.find(s => s.id === gameState.active_script_id) || null;

      const titleEl = document.getElementById('active-script-title');
      const subEl = document.getElementById('active-script-summary');
      const feedEl = document.getElementById('story-feed');
      const choicesEl = document.getElementById('choices-box');

      if (!activeScript) {
        titleEl.textContent = '等待抽取剧本';
        subEl.textContent = '点击上方「随机切换剧本」开启今晚的剧情';
        feedEl.innerHTML = '';
        choicesEl.innerHTML = '';
        return;
      }

      titleEl.textContent = activeScript.title;
      subEl.textContent = activeScript.summary || '';

      // 渲染历史记录流
      const logs = Array.isArray(gameState.story_log) ? gameState.story_log : [];
      feedEl.innerHTML = logs.map(item => {
        if (item.type === 'narrator') {
          return `<div class="msg-narrator">${item.text}</div>`;
        } else {
          return `<div class="msg-player"><span>[${item.actor}]</span>${item.text}</div>`;
        }
      }).join('');
      feedEl.scrollTop = feedEl.scrollHeight;

      // 渲染当前节点的可选分支按钮
      const currentNode = activeScript.nodes[gameState.current_node_id];
      choicesEl.innerHTML = '';
      if (currentNode && Array.isArray(currentNode.choices)) {
        currentNode.choices.forEach(choice => {
          const btn = document.createElement('button');
          btn.className = 'btn-choice';
          btn.textContent = choice.label;
          btn.onclick = () => selectBranch(choice);
          choicesEl.appendChild(btn);
        });
      }
    }

    // 选择分支推进剧情
    async function selectBranch(choice) {
      if (!activeScript || !gameState) return;
      const nextNode = activeScript.nodes[choice.next];
      const newLogs = [...(gameState.story_log || [])];
      newLogs.push({ type: 'player', actor: currentPlayer, text: `选择了：${choice.label}` });
      if (nextNode) {
        newLogs.push({ type: 'narrator', text: nextNode.text });
      }
      await db.from('game_state').update({
        current_node_id: choice.next,
        story_log: newLogs,
        updated_at: new Date().toISOString()
      }).eq('id', 1);
    }

    // 随机抽取剧本并初始化开场
    document.getElementById('btn-random-script').addEventListener('click', async () => {
      await loadScripts();
      if (allScripts.length === 0) return alert('剧本库为空，请先上传剧本');
      let candidates = allScripts;
      if (allScripts.length > 1 && activeScript) {
        candidates = allScripts.filter(s => s.id !== activeScript.id);
      }
      const picked = candidates[Math.floor(Math.random() * candidates.length)];
      const startNode = picked.nodes['start'];
      const initialLog = startNode ? [{ type: 'narrator', text: startNode.text }] : [];

      await db.from('game_state').update({
        active_script_id: picked.id,
        current_node_id: 'start',
        story_log: initialLog,
        updated_at: new Date().toISOString()
      }).eq('id', 1);
    });

    // 发送自由文字台词/动作
    async function sendCustomMessage() {
      const input = document.getElementById('custom-msg-input');
      const text = input.value.trim();
      if (!text || !gameState) return;
      input.value = '';
      const newLogs = [...(gameState.story_log || []), { type: 'player', actor: currentPlayer, text }];
      await db.from('game_state').update({
        story_log: newLogs,
        updated_at: new Date().toISOString()
      }).eq('id', 1);
    }
    document.getElementById('btn-send-msg').addEventListener('click', sendCustomMessage);
    document.getElementById('custom-msg-input').addEventListener('keypress', e => {
      if (e.key === 'Enter') sendCustomMessage();
    });

    // 折叠/展开上传剧本面板
    document.getElementById('btn-toggle-upload').addEventListener('click', () => {
      document.getElementById('upload-panel').classList.toggle('hidden');
    });

    // 保存新剧本到云端
    document.getElementById('btn-save-script').addEventListener('click', async () => {
      const title = document.getElementById('new-script-title').value.trim();
      const summary = document.getElementById('new-script-summary').value.trim();
      const rawJson = document.getElementById('new-script-json').value.trim();
      if (!title || !rawJson) return alert('请填写剧本名称和 JSON 内容');
      try {
        const parsedNodes = JSON.parse(rawJson);
        if (!parsedNodes.start) return alert('JSON 必须包含 "start" 起始节点');
        const { error } = await db.from('scripts').insert([{ title, summary, nodes: parsedNodes }]);
        if (error) throw error;
        alert('剧本已保存！现在可以点击“随机切换剧本”抽到它了');
        document.getElementById('new-script-title').value = '';
        document.getElementById('new-script-summary').value = '';
        document.getElementById('new-script-json').value = '';
        document.getElementById('upload-panel').classList.add('hidden');
        await loadScripts();
      } catch (e) {
        alert('格式有误：' + e.message);
      }
    });

    async function initSession(email) {
      currentPlayer = email.startsWith('yc') ? 'YC' : 'LY';
      loginView.classList.add('hidden');
      gameView.classList.remove('hidden');

      await loadScripts();
      const { data } = await db.from('game_state').select('*').eq('id', 1).single();
      gameState = data;
      renderGame();

      const channel = db.channel('room-1', { config: { presence: { key: currentPlayer } } });
      channel
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'game_state', filter: 'id=eq.1' }, async (payload) => {
          gameState = payload.new;
          if (gameState.active_script_id && !allScripts.find(s => s.id === gameState.active_script_id)) {
            await loadScripts();
          }
          renderGame();
        })
        .on('presence', { event: 'sync' }, () => updatePresenceUI(channel.presenceState()))
        .subscribe(async status => {
          if (status === 'SUBSCRIBED') await channel.track({ player: currentPlayer });
        });
    }

    db.auth.getSession().then(({ data: { session } }) => {
      if (session) initSession(session.user.email);
    });

    document.getElementById('login-btn').addEventListener('click', async () => {
      const email = document.getElementById('player-select').value;
      const password = document.getElementById('password-input').value;
      const { data, error } = await db.auth.signInWithPassword({ email, password });
      if (error) {
        document.getElementById('login-error').textContent = '验证失败: ' + error.message;
      } else {
        initSession(data.user.email);
      }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await db.auth.signOut();
      location.reload();
    });
  </script>
</body>
</html>
